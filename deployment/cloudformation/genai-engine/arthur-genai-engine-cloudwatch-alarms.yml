AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  ArthurResourceNamespace:
    Description: 'A unique namespace for this Arthur stack resources (e.g. arthur1). It should be between 1 and 14 characters long.'
    Type: String
    MinLength: '1'
    MaxLength: '14'
    ConstraintDescription: 'The Arthur platform resources namespace must be 1-14 characters long.'
    Default: 'arthur'
  ArthurResourceNameSuffix:
    Description: 'Name suffix for this Arthur stack resources (e.g. -prod). It should be between 0 and 5 characters long.'
    Type: String
    MinLength: '0'
    MaxLength: '5'
    ConstraintDescription: 'The Arthur platform resources name suffix must be 0-5 characters long.'
    Default: ''
  AlarmSNSTopicArn:
    Type: String
    Description: 'The ARN of the SNS topic to send the alarms to'
  GenaiEngineLBTargetGroupArnSuffix:
    Type: String
    Description: 'The GenAI Engine target group ARN suffix (e.g. targetgroup/arthur-genai-engine/0000000000000000)'
  GenaiEngineLBArnSuffix:
    Type: String
    Description: 'The GenAI Engine application load balancer ARN suffix (e.g. app/arthur-genai-engine-lb/0000000000000000'
  ArthurECSClusterName:
    Type: String
    Default: 'arthur'
    Description: 'The Arthur ECS cluster name (e.g. arthur)'
  GenaiEngineECSServiceName:
    Type: String
    Default: 'arthur-genai-engine'
    Description: 'The Arthur GenAI Engine ECS service name (e.g. arthur-genai-engine)'
  GenaiEngineLoadBalancerHealthyHostCountAlarmThreshold:
    Type: Number
    Default: 1
    Description: 'Alarm is triggered when the healthy Arthur GenAI Engine application host count drops below this number'
  GenaiEngineLoadBalancerTarget5xxAlarmThreshold:
    Type: Number
    Default: 10
    Description: 'Alarm is triggered when Arthur GenAI Engine raises more than this number of 5xx errors in a minute'
  GenaiEngineLoadBalancerTargetResponseTimeAlarmThreshold:
    Type: Number
    Default: 30
    Description: 'Alarm is triggered when the Arthur GenAI Engine average response time is longer than this number of seconds'
  GenaiEngineECSMemoryAlarmThreshold:
    Type: Number
    Default: 87
    Description: 'Alarm is triggered when Arthur GenAI Engine service uses this percentage of memory in a minute'
  GenaiEngineRDSClusterIdentifier:
    Type: String
    Default: 'None'
    Description: 'The GenAI Engine Aurora cluster identifier (e.g. arthur-db-cluster). Defaults to "None" for bring-your-own-DB deployments, which skips the RDS alarms.'
  GenaiEngineRDSHighCPUAlarmThreshold:
    Type: Number
    Default: 90
    Description: 'Alarm is triggered when the GenAI Engine Aurora WRITER instance CPU utilization exceeds this percentage'
  GenaiEngineRDSLowFreeableMemoryAlarmThreshold:
    Type: Number
    Default: 268435456
    Description: 'Alarm is triggered when the GenAI Engine Aurora WRITER instance FreeableMemory drops below this many bytes. Default 256 MiB; tune per deployment max ACU.'
  GenaiEngineRDSHighDiskQueueDepthAlarmThreshold:
    Type: Number
    Default: 64
    Description: 'Alarm is triggered when the GenAI Engine Aurora WRITER instance DiskQueueDepth exceeds this value'
  GenaiEngineRDSHighVolumeBytesUsedAlarmThreshold:
    Type: Number
    Default: 1099511627776
    Description: 'Alarm is triggered when the GenAI Engine Aurora cluster VolumeBytesUsed exceeds this many bytes. Default 1 TiB. Aurora storage auto-grows, so this is a runaway-growth / cost watch, not a free-space watch.'

Conditions:
  # Aurora Serverless v2 is only provisioned when the deployment is not bring-your-own-DB,
  # in which case CoreRDSStack emits the cluster identifier (otherwise "None"). Skip the RDS
  # alarms for BYO-DB deployments so we never create an alarm on a metric that has no data.
  HasProvisionedRDS: !Not [ !Equals [ !Ref GenaiEngineRDSClusterIdentifier, 'None' ] ]

Resources:
  ArthurGenaiEngineLoadBalancerHealthyHostCount:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-lb-healthy-host-count-alarm"
      AlarmDescription: !Sub "Alarm when the healthy Arthur GenAI Engine host count drops below ${GenaiEngineLoadBalancerHealthyHostCountAlarmThreshold}"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      InsufficientDataActions: [ ]
      MetricName: 'HealthyHostCount'
      Namespace: 'AWS/ApplicationELB'
      Statistic: 'SampleCount'
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref GenaiEngineLBArnSuffix
        - Name: TargetGroup
          Value: !Ref GenaiEngineLBTargetGroupArnSuffix
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref GenaiEngineLoadBalancerHealthyHostCountAlarmThreshold
      ComparisonOperator: 'LessThanOrEqualToThreshold'
  ArthurGenaiEngineLoadBalancerTarget5xx:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-lb-target-5xx-alarm"
      AlarmDescription: !Sub "Alarm when Arthur GenAI Engine raises more than ${GenaiEngineLoadBalancerTarget5xxAlarmThreshold} 5xx errors in a minute"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Dimensions:
        - Name: TargetGroup
          Value: !Ref GenaiEngineLBTargetGroupArnSuffix
        - Name: LoadBalancer
          Value: !Ref GenaiEngineLBArnSuffix
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref GenaiEngineLoadBalancerTarget5xxAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
  ArthurGenaiEngineLoadBalancerTargetResponseTime:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-lb-target-response-time-alarm"
      AlarmDescription: !Sub "Alarm when the Arthur GenAI Engine average response time is longer than ${GenaiEngineLoadBalancerTargetResponseTimeAlarmThreshold} seconds"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      Statistic: Average
      Dimensions:
        - Name: TargetGroup
          Value: !Ref GenaiEngineLBTargetGroupArnSuffix
        - Name: LoadBalancer
          Value: !Ref GenaiEngineLBArnSuffix
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref GenaiEngineLoadBalancerTargetResponseTimeAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
  ArthurGenaiEngineECSMemory:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-ecs-memory-alarm"
      AlarmDescription: !Sub "Alarm when Arthur GenAI Engine service uses max ${GenaiEngineECSMemoryAlarmThreshold}% of memory in a minute"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Maximum
      Dimensions:
        - Name: ServiceName
          Value: !Ref GenaiEngineECSServiceName
        - Name: ClusterName
          Value: !Ref ArthurECSClusterName
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref GenaiEngineECSMemoryAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
  # GenAI Engine Aurora (RDS) alarms. CPU/FreeableMemory/DiskQueueDepth are dimensioned on
  # DBClusterIdentifier + Role=WRITER (the instance-level metrics Vanta accepts). VolumeBytesUsed
  # is cluster-level (DBClusterIdentifier only, no Role dimension). These mirror the scope alarms
  # stack (arthur-scope !2032) and clear the Vanta SQL-database CPU/memory/IO/storage tests.
  # Storage note: Vanta's storage-space test only accepts FreeStorageSpace / FreeLocalStorage /
  # AuroraVolumeBytesLeftTotal, none of which Aurora Serverless v2 (db.serverless) emits, so an
  # alarm on those would never have data. The engine DB has a Vanta exception on that test; we
  # still add a real alarm on VolumeBytesUsed (which IS emitted) to watch storage growth.
  ArthurGenaiEngineRDSCPU:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProvisionedRDS
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-rds-cpu-alarm"
      AlarmDescription: !Sub "Alarm when the GenAI Engine Aurora WRITER instance of cluster ${GenaiEngineRDSClusterIdentifier} CPU utilization exceeds ${GenaiEngineRDSHighCPUAlarmThreshold}%"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref GenaiEngineRDSClusterIdentifier
        - Name: Role
          Value: WRITER
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref GenaiEngineRDSHighCPUAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Unit: Percent
  ArthurGenaiEngineRDSFreeableMemory:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProvisionedRDS
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-rds-freeable-memory-alarm"
      AlarmDescription: !Sub "Alarm when the GenAI Engine Aurora WRITER instance of cluster ${GenaiEngineRDSClusterIdentifier} FreeableMemory drops below ${GenaiEngineRDSLowFreeableMemoryAlarmThreshold} bytes"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: FreeableMemory
      Namespace: AWS/RDS
      Statistic: Average
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref GenaiEngineRDSClusterIdentifier
        - Name: Role
          Value: WRITER
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref GenaiEngineRDSLowFreeableMemoryAlarmThreshold
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Unit: Bytes
  ArthurGenaiEngineRDSDiskQueueDepth:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProvisionedRDS
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-rds-disk-queue-depth-alarm"
      AlarmDescription: !Sub "Alarm when the GenAI Engine Aurora WRITER instance of cluster ${GenaiEngineRDSClusterIdentifier} DiskQueueDepth exceeds ${GenaiEngineRDSHighDiskQueueDepthAlarmThreshold}"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: DiskQueueDepth
      Namespace: AWS/RDS
      Statistic: Average
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref GenaiEngineRDSClusterIdentifier
        - Name: Role
          Value: WRITER
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref GenaiEngineRDSHighDiskQueueDepthAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Unit: Count
  ArthurGenaiEngineRDSVolumeBytesUsed:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProvisionedRDS
    Properties:
      AlarmName: !Sub "[${ArthurResourceNamespace}${ArthurResourceNameSuffix}] genai-engine-rds-volume-bytes-used-alarm"
      AlarmDescription: !Sub "Alarm when the GenAI Engine Aurora cluster ${GenaiEngineRDSClusterIdentifier} VolumeBytesUsed exceeds ${GenaiEngineRDSHighVolumeBytesUsedAlarmThreshold} bytes (storage auto-grows; this watches for runaway growth)"
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmSNSTopicArn
      MetricName: VolumeBytesUsed
      Namespace: AWS/RDS
      Statistic: Average
      Dimensions:
        - Name: DBClusterIdentifier
          Value: !Ref GenaiEngineRDSClusterIdentifier
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref GenaiEngineRDSHighVolumeBytesUsedAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Unit: Bytes
