AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  ArthurResourceNamespace:
    Description: 'A unique namespace for this Arthur stack resources (e.g. arthur1). It should be between 1 and 14 characters long.'
    Type: String
    MinLength: '1'
    MaxLength: '14'
    ConstraintDescription: 'The Arthur platform resources namespace must be 1-14 characters long.'
    Default: 'arthur'
  ArthurResourceNameSuffix:
    Description: 'Name suffix for this Arthur stack resources (e.g. -prod). It should be between 0 and 5 characters long.'
    Type: String
    MinLength: '0'
    MaxLength: '5'
    ConstraintDescription: 'The Arthur platform resources name suffix must be 0-5 characters long.'
    Default: ''
  ArthurBringYourOwnDBEndpoint:
    Type: String
    Default: ''
    Description: 'Bring-your-own database endpoint. If not specified, an Aurora Serverless cluster will be provisioned.'
  ArthurBringYourOwnDBPort:
    Type: Number
    Default: 5432
    Description: 'Port for bring-your-own database'
  ArthurRDSDatabaseName:
    Type: String
    Default: 'arthur'
  ArthurDBSecretArn:
    Type: String
    Description: 'Secret ARN to store database credentials in'
  ArthurRDSScalingConfigurationMinCapacity:
    Type: Number
    Default: 0.5
    Description: 'Aurora Serverless v2 minimum scaling capacity in ACU'
  ArthurRDSScalingConfigurationMaxCapacity:
    Type: Number
    Default: 16
    Description: 'Aurora Serverless v2 maximum scaling capacity in ACU'
  ArthurRDSSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: 'List of security groups to apply to the cluster'
  ArthurRDSPrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'List of private subnets to use for the cluster'
  EnableBackupVault:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Enable AWS Backup with an immutable (Vault Lock) backup vault for the Aurora cluster. Opt-in and non-breaking: existing deployments are unaffected when left false. Only applies when Arthur provisions the database (not bring-your-own-DB).'
  BackupRetentionDays:
    Type: Number
    Default: 60
    MinValue: 7
    MaxValue: 3650
    Description: 'Retention (in days) for AWS Backup recovery points and the Vault Lock minimum-retention floor. Default 60 matches Arthur policy; the GDPR / Annex B minimum is 7 days. Note: Aurora native automated backups cap at 35 days, so retention beyond 35 days requires this AWS Backup path.'
  BackupVaultLockChangeableForDays:
    Type: Number
    Default: 0
    Description: 'Vault Lock mode selector. 0 = GOVERNANCE mode (immutability enforced but removable by privileged admins - the safe default). A value >= 3 enables COMPLIANCE mode with this many days of grace, after which the lock is PERMANENT and IRREVERSIBLE (recovery points cannot be deleted by anyone, including the account root, until retention expires). Only set >= 3 with explicit organizational approval.'

Conditions:
  CreateRDS: !Equals
    - !Ref ArthurBringYourOwnDBEndpoint
    - ""
  BackupVaultEnabled: !Equals
    - !Ref EnableBackupVault
    - 'true'
  EnableBackup: !And
    - !Condition CreateRDS
    - !Condition BackupVaultEnabled
  ComplianceModeLock: !Not
    - !Equals
      - !Ref BackupVaultLockChangeableForDays
      - 0

Resources:
  ArthurDBKMSKey:
    Type: AWS::KMS::Key
    Condition: CreateRDS
    Properties:
      Description: 'Arthur DB KMS key'
      Enabled: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: 'key-default-1'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: 'kms:*'
            Resource: '*'
  ArthurRDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: CreateRDS
    Properties:
      DBSubnetGroupDescription: !Sub "RDS Subnet group for ${ArthurResourceNamespace} stack"
      DBSubnetGroupName: !Sub "${ArthurResourceNamespace}-rds-subnet-group${ArthurResourceNameSuffix}"
      SubnetIds: !Ref ArthurRDSPrivateSubnets
  ArthurRDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Condition: CreateRDS
    Properties:
      Family: 'aurora-postgresql15'
      Description: !Sub "RDS Parameter group for ${ArthurResourceNamespace} stack"
      DBParameterGroupName: !Sub "${ArthurResourceNamespace}-rds-parameter-group${ArthurResourceNameSuffix}"
  ArthurRDSCluster:
    Type: AWS::RDS::DBCluster
    Condition: CreateRDS
    Properties:
      DBClusterIdentifier: !Sub "${ArthurResourceNamespace}-db-cluster${ArthurResourceNameSuffix}"
      DatabaseName: !Ref ArthurRDSDatabaseName
      Engine: 'aurora-postgresql'
      EngineVersion: '15'
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref ArthurRDSScalingConfigurationMinCapacity
        MaxCapacity: !Ref ArthurRDSScalingConfigurationMaxCapacity
      StorageEncrypted: true
      KmsKeyId: !Ref ArthurDBKMSKey
      BackupRetentionPeriod: 35
      Port: 5432
      PreferredBackupWindow: '04:00-07:00'
      PreferredMaintenanceWindow: 'Mon:07:00-Mon:10:00'
      VpcSecurityGroupIds: !Ref ArthurRDSSecurityGroupIds
      DBSubnetGroupName: !Ref ArthurRDSSubnetGroup
      MasterUsername: !Sub "{{resolve:secretsmanager:${ArthurDBSecretArn}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${ArthurDBSecretArn}:SecretString:password}}"
      DeletionProtection: true
      CopyTagsToSnapshot: true
  ArthurRDSInstance:
    Type: AWS::RDS::DBInstance
    Condition: CreateRDS
    Properties:
      DBInstanceIdentifier: !Sub "${ArthurResourceNamespace}-db-instance${ArthurResourceNameSuffix}"
      DBClusterIdentifier: !Ref ArthurRDSCluster
      DBInstanceClass: 'db.serverless'
      Engine: 'aurora-postgresql'
      DBSubnetGroupName: !Ref ArthurRDSSubnetGroup
      DBParameterGroupName: !Ref ArthurRDSParameterGroup
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7

  # ---------------------------------------------------------------------------
  # Optional immutable backups (AWS Backup + Vault Lock).
  # Created only when EnableBackupVault=true AND Arthur provisions the database.
  # Addresses GDPR / Annex B: immutable backups retained >= 7 days (default 60).
  # Aurora's own 35-day automated backups remain in place; these resources add
  # a write-once (WORM) recovery point that cannot be deleted before retention.
  # ---------------------------------------------------------------------------
  ArthurBackupVault:
    Type: AWS::Backup::BackupVault
    Condition: EnableBackup
    Properties:
      BackupVaultName: !Sub "${ArthurResourceNamespace}-db-backup-vault${ArthurResourceNameSuffix}"
      EncryptionKeyArn: !GetAtt ArthurDBKMSKey.Arn
      LockConfiguration:
        MinRetentionDays: !Ref BackupRetentionDays
        ChangeableForDays: !If
          - ComplianceModeLock
          - !Ref BackupVaultLockChangeableForDays
          - !Ref "AWS::NoValue"

  ArthurBackupRole:
    Type: AWS::IAM::Role
    Condition: EnableBackup
    Properties:
      RoleName: !Sub "${ArthurResourceNamespace}-db-backup-role${ArthurResourceNameSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"

  ArthurBackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: EnableBackup
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${ArthurResourceNamespace}-db-backup-plan${ArthurResourceNameSuffix}"
        BackupPlanRule:
          - RuleName: 'DailyImmutableBackup'
            TargetBackupVault: !Ref ArthurBackupVault
            ScheduleExpression: 'cron(0 5 ? * * *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: !Ref BackupRetentionDays

  ArthurBackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: EnableBackup
    Properties:
      BackupPlanId: !Ref ArthurBackupPlan
      BackupSelection:
        SelectionName: !Sub "${ArthurResourceNamespace}-db-backup-selection${ArthurResourceNameSuffix}"
        IamRoleArn: !GetAtt ArthurBackupRole.Arn
        Resources:
          - !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${ArthurRDSCluster}"

Outputs:
  RDSInstanceAddressOutput:
    Description: RDS Instance address.
    Value: !If [ CreateRDS, !GetAtt ArthurRDSCluster.Endpoint.Address, !Ref ArthurBringYourOwnDBEndpoint ]
  RDSInstancePortOutput:
    Description: RDS Instance port.
    Value: !If [ CreateRDS, !GetAtt ArthurRDSCluster.Endpoint.Port, !Ref ArthurBringYourOwnDBPort ]
  RDSClusterIdentifierOutput:
    Description: RDS Cluster identifier.
    Value: !If [ CreateRDS, !Ref ArthurRDSCluster, 'None' ]
  ArthurBackupVaultArnOutput:
    Condition: EnableBackup
    Description: ARN of the immutable AWS Backup vault protecting the Arthur database.
    Value: !GetAtt ArthurBackupVault.BackupVaultArn
