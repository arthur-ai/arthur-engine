# EC2: the same unit, running the SSM custom inventory reporter in place of the guest-attribute
# one. Installed beside arthur-ai-discovery.service by the association in docs/mdm/ec2.md.
[Unit]
Description=Arthur AI inventory: collect, then write SSM custom inventory
Documentation=https://github.com/arthur-ai/arthur-engine/blob/dev/integrations/endpoint-ai-discovery/docs/mdm/ec2.md

[Service]
# The empty assignment clears the unit's own ExecStart; a oneshot would otherwise run both.
ExecStart=
ExecStart=/usr/local/arthur/report-ssm-inventory.sh
