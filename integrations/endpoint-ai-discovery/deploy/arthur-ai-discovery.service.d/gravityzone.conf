# Bitdefender GravityZone: the same unit, running the collector alone. GravityZone reads
# /var/lib/arthur/inventory.ea itself, with a command Arthur's scan sends through the
# Investigation API, so there is nothing to publish. See docs/mdm/gravityzone.md.
[Unit]
Description=Arthur AI inventory: collect to /var/lib/arthur
Documentation=https://github.com/arthur-ai/arthur-engine/blob/dev/integrations/endpoint-ai-discovery/docs/mdm/gravityzone.md

[Service]
# The empty assignment clears the unit's own ExecStart; a oneshot would otherwise run both.
ExecStart=
ExecStart=/usr/local/arthur/collect-linux.sh
