 sig(agent, name, classification, kind, mode, value, superseded) AS (VALUES ('kilo-code','Kilo Code','Coding agent','npm','exact','@kilocode/cli',0), ('kilo-code','Kilo Code','Coding agent','proc','exact','@kilocode/cli',0), ('kilo-code','Kilo Code','Coding agent','vscodeext','exact','kilocode.kilo-code',0)), hit AS (SELECT s.agent, s.name, s.classification, s.superseded, e.kind, e.id, e.ver, e.loc FROM ev e JOIN sig s ON s.kind = e.kind AND CASE s.mode WHEN 'exact' THEN e.id = s.value WHEN 'prefix' THEN substr(e.id, 1, length(s.value)) = s.value WHEN 'path' THEN instr(e.id, regex_match(e.id, s.value, 0)) = 1 OR instr(e.loc, regex_match(e.loc, s.value, 0)) = 1 WHEN 'image' THEN regex_match(e.id, s.value, 0) IS NOT NULL WHEN 'tool-dir' THEN (instr(e.id, regex_match(e.id, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 0)) = 1 AND regex_match(e.id, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 1) = s.value) OR (instr(e.id, regex_match(e.id, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 0)) = 1 AND regex_match(e.id, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 1) = s.value) OR (instr(e.loc, regex_match(e.loc, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 0)) = 1 AND regex_match(e.loc, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 1) = s.value) OR (instr(e.loc, regex_match(e.loc, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 0)) = 1 AND regex_match(e.loc, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 1) = s.value) ELSE 0 END) SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM hit);
