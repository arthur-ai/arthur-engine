    WITH ev AS ( SELECT 'vscodeext' AS kind, name AS id, version AS ver, path AS loc, vscode_edition AS extra, '' AS perms FROM (SELECT uid FROM users) u CROSS JOIN vscode_extensions USING (uid) ) , sig(agent, name, classification, kind, mode, value, superseded) AS (VALUES ('roo-code','Roo Code','Coding agent','vscodeext','exact','rooveterinaryinc.roo-cline',0)), hit AS (SELECT s.agent, s.name, s.classification, s.superseded, e.kind, e.id, e.ver, e.loc FROM ev e JOIN sig s ON s.kind = e.kind AND CASE s.mode WHEN 'exact' THEN e.id = s.value WHEN 'prefix' THEN substr(e.id, 1, length(s.value)) = s.value WHEN 'path' THEN instr(e.id, regex_match(e.id, s.value, 0)) = 1 OR instr(e.loc, regex_match(e.loc, s.value, 0)) = 1 WHEN 'image' THEN regex_match(e.id, s.value, 0) IS NOT NULL WHEN 'tool-dir' THEN (instr(e.id, regex_match(e.id, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 0)) = 1 AND regex_match(e.id, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 1) = s.value) OR (instr(e.id, regex_match(e.id, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 0)) = 1 AND regex_match(e.id, '^[A-Za-z]:[\\/]Users[\\/][^\\/]+[\\/](?:\.local[\\/]pipx[\\/]venvs[\\/]|\.local[\\/]share[\\/]uv[\\/]tools[\\/]|AppData[\\/]Local[\\/]pipx[\\/]pipx[\\/]venvs[\\/]|AppData[\\/]Roaming[\\/]uv[\\/]tools[\\/])([^\\/]+)[\\/]?(?![\s\S])', 1) = s.value) OR (instr(e.loc, regex_match(e.loc, '^(?:/Users/[^/]+/|/home/[^/]+/|/root/)(?:\.local/pipx/venvs/|\.local/share/uv/tools/|AppData/Local/pipx/pipx/venvs/|AppData/Roaming/uv/tools/)([^/]+)/?(?![\s\S])', 0)) = 1 AND regex_match(e.loc, '^(?:/Users/