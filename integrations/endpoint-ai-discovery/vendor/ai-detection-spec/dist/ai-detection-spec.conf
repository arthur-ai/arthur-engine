{
  "queries": {
    "apps": {
      "description": "Every installed .app bundle",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'app' AS kind, bundle_identifier AS id, bundle_short_version AS ver, path AS loc, '' AS extra, '' AS perms FROM apps;"
    },
    "browser": {
      "description": "Browser extensions with their permissions",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'ext' AS kind, identifier AS id, version AS ver, profile_path AS loc, browser_type || CASE WHEN referenced = 0 THEN ',unreferenced' WHEN from_webstore != 'true' THEN ',sideloaded:' || IFNULL(manifest_hash, '') ELSE '' END AS extra, permissions || CASE WHEN manifest_json LIKE '%<all_urls>%' THEN ',<all_urls>' ELSE '' END AS perms FROM (SELECT uid FROM users UNION SELECT uid FROM file WHERE path LIKE '/home/%/' OR path = '/root/' OR path LIKE '/Users/%/') u CROSS JOIN chrome_extensions USING (uid);"
    },
    "containers": {
      "description": "Container images, running containers and vendor labels, which hide agents every other branch misses",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'image' AS kind, tags AS id, '' AS ver, id AS loc, CAST(size_bytes AS TEXT) AS extra, '' AS perms FROM docker_images UNION ALL SELECT 'container' AS kind, c.image AS id, '' AS ver, c.id AS loc, c.command AS extra, CASE WHEN c.privileged = 1 THEN 'privileged' ELSE '' END AS perms FROM docker_containers c WHERE c.state = 'running' UNION ALL SELECT 'ilabel' AS kind, l.value AS id, '' AS ver, l.id AS loc, l.key AS extra, '' AS perms FROM docker_image_labels l WHERE l.key = 'org.opencontainers.image.source';"
    },
    "desktop-linux": {
      "description": "Desktop entries, which are the only trace an AppImage or tarball install leaves",
      "interval": 3600,
      "platform": "linux",
      "query": "SELECT 'desktop' AS kind, filename AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/usr/share/applications/%.desktop' OR path LIKE '/usr/local/share/applications/%.desktop' UNION ALL SELECT 'desktop', filename, '', path, '', '' FROM file WHERE path LIKE '/home/%/.local/share/applications/%.desktop' OR path LIKE '/root/.local/share/applications/%.desktop';"
    },
    "filesystem": {
      "description": "Home-directory install locations: CLI shims, state dotdirs, tool venvs, model stores",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'file' AS kind, path AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/Users/%/.local/bin/%' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE path LIKE '/Users/%/.%/' AND path NOT LIKE '%/./' AND path NOT LIKE '%/../' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE path LIKE '/Users/%/.local/pipx/venvs/%/' OR path LIKE '/Users/%/.local/share/uv/tools/%/';"
    },
    "filesystem-linux": {
      "description": "Home-directory install locations on Linux: CLI shims, state dotdirs, tool venvs",
      "interval": 3600,
      "platform": "linux",
      "query": "SELECT 'file' AS kind, path AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/home/%/.local/bin/%' OR path LIKE '/root/.local/bin/%' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE (path LIKE '/home/%/.%/' OR path LIKE '/root/.%/') AND path NOT LIKE '%/./' AND path NOT LIKE '%/../' UNION ALL SELECT 'file', path, '', path, '', '' FROM file WHERE path LIKE '/home/%/.local/pipx/venvs/%/' OR path LIKE '/home/%/.local/share/uv/tools/%/' OR path LIKE '/root/.local/pipx/venvs/%/' OR path LIKE '/root/.local/share/uv/tools/%/';"
    },
    "homebrew": {
      "description": "Every Homebrew formula and cask",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'brew' AS kind, name AS id, version AS ver, path AS loc, type AS extra, '' AS perms FROM homebrew_packages;"
    },
    "jetbrains": {
      "description": "JetBrains IDE plugins, the second editor route Continue and Cline ship through",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'jbplugin' AS kind, regex_match(path, '([^/]+)/?$', 1) AS id, version AS ver, path AS loc, vendor AS extra, '' AS perms FROM (SELECT uid FROM users UNION SELECT uid FROM file WHERE path LIKE '/home/%/' OR path = '/root/' OR path LIKE '/Users/%/') u CROSS JOIN jetbrains_plugins USING (uid);"
    },
    "native-messaging": {
      "description": "Native messaging bridges between a browser and a desktop app",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'nmh' AS kind, filename AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/Users/%/Library/Application Support/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/Users/%/Library/Application Support/%/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/Library/%/%/NativeMessagingHosts/%.json' AND filename != 'com.apple.passwordmanager.json';"
    },
    "native-messaging-linux": {
      "description": "Native messaging bridges between a browser and a desktop app, on Linux",
      "interval": 3600,
      "platform": "linux",
      "query": "SELECT 'nmh' AS kind, filename AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM file WHERE path LIKE '/home/%/.config/%/NativeMessagingHosts/%.json' OR path LIKE '/root/.config/%/NativeMessagingHosts/%.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/home/%/.mozilla/native-messaging-hosts/%.json' OR path LIKE '/root/.mozilla/native-messaging-hosts/%.json' UNION ALL SELECT 'nmh', filename, '', path, '', '' FROM file WHERE path LIKE '/etc/%/native-messaging-hosts/%.json' OR path LIKE '/etc/opt/%/native-messaging-hosts/%.json' OR path LIKE '/usr/lib/%/native-messaging-hosts/%.json';"
    },
    "packages": {
      "description": "Every npm global package, and every bun global",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'npm' AS kind, name AS id, version AS ver, path AS loc, '' AS extra, '' AS perms FROM npm_packages WHERE path NOT LIKE '%/node_modules/%/node_modules/%' UNION ALL SELECT 'npm', np.name, np.version, np.path, 'bun', '' FROM (SELECT directory AS home FROM users UNION SELECT rtrim(path, '/') FROM file WHERE path LIKE '/home/%/' OR path = '/root/' OR path LIKE '/Users/%/') h CROSS JOIN npm_packages np ON np.directory = h.home || '/.bun/install/global' WHERE np.path NOT LIKE '%/node_modules/%/node_modules/%';"
    },
    "packages-linux": {
      "description": "Every installed deb and rpm package",
      "interval": 3600,
      "platform": "linux",
      "query": "SELECT 'deb' AS kind, name AS id, version AS ver, '' AS loc, arch AS extra, '' AS perms FROM deb_packages WHERE status LIKE '%ok installed' UNION ALL SELECT 'rpm', name, version, '', vendor, '' FROM rpm_packages;"
    },
    "ports": {
      "description": "Every process holding a listening port",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'port' AS kind, CAST(lp.port AS TEXT) AS id, '' AS ver, p.path AS loc, lp.address AS extra, '' AS perms FROM listening_ports lp JOIN processes p USING (pid) WHERE lp.port > 0;"
    },
    "running": {
      "description": "Running node packages by name, and agents running from a home directory",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'proc' AS kind, regex_match(exe || ' ' || cmdline, 'node_modules/((?:@[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]*)', 1) AS id, '' AS ver, exe AS loc, '' AS extra, '' AS perms FROM (SELECT cmdline, CASE WHEN path != '' THEN path ELSE substr(cmdline, 1, instr(cmdline || ' ', ' ') - 1) END AS exe FROM processes) p WHERE (exe LIKE '%/node_modules/%' OR ((exe LIKE '%/node' OR exe LIKE '%/nodejs' OR exe LIKE '%/bun' OR exe LIKE '%/deno' OR exe IN ('node', 'nodejs', 'bun', 'deno')) AND cmdline LIKE '%node_modules/%')) AND regex_match(exe || ' ' || cmdline, 'node_modules/((?:@[A-Za-z0-9][A-Za-z0-9._-]*/)?[A-Za-z0-9][A-Za-z0-9._-]*)', 1) IS NOT NULL GROUP BY id, loc UNION ALL SELECT 'proc', path, '', path, '', '' FROM processes WHERE path LIKE '/Users/%/%' OR path LIKE '/home/%/%' OR path LIKE '/root/%' GROUP BY path;"
    },
    "running-darwin": {
      "description": "Running app bundles by bundle id, the macOS half of \"installed and running\"",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'proc' AS kind, pl.value AS id, '' AS ver, x.app AS loc, '' AS extra, '' AS perms FROM (SELECT DISTINCT substr(path, 1, instr(path, '.app/') + 3) AS app FROM processes WHERE path LIKE '%.app/Contents/MacOS/%') x CROSS JOIN plist pl ON pl.path = x.app || '/Contents/Info.plist' WHERE pl.key = 'CFBundleIdentifier';"
    },
    "runtime": {
      "description": "Non-Apple launchd jobs",
      "interval": 3600,
      "platform": "darwin",
      "query": "SELECT 'daemon' AS kind, label AS id, '' AS ver, path AS loc, '' AS extra, '' AS perms FROM launchd WHERE label NOT LIKE 'com.apple.%';"
    },
    "runtime-linux": {
      "description": "systemd units, with a marker saying whether the unit list could be read",
      "interval": 3600,
      "platform": "linux",
      "query": "SELECT 'unit' AS kind, id AS id, '' AS ver, fragment_path AS loc, unit_file_state AS extra, '' AS perms FROM systemd_units UNION ALL SELECT 'scan' AS kind, 'systemd' AS id, CAST(t.unix_time AS TEXT) AS ver, '/run/dbus/system_bus_socket' AS loc, CASE WHEN u.n > 0 THEN 'ok' WHEN s.n = 0 THEN 'absent' ELSE 'unhealthy:no-units' END AS extra, '' AS perms FROM time t, (SELECT COUNT(*) AS n FROM systemd_units) u, (SELECT COUNT(*) AS n FROM file WHERE path = '/run/dbus/system_bus_socket') s;"
    },
    "vscode": {
      "description": "VS Code extensions, which is how several agents primarily ship",
      "interval": 3600,
      "platform": "posix",
      "query": "SELECT 'vscodeext' AS kind, name AS id, version AS ver, path AS loc, vscode_edition AS extra, '' AS perms FROM (SELECT uid FROM users UNION SELECT uid FROM file WHERE path LIKE '/home/%/' OR path = '/root/' OR path LIKE '/Users/%/') u CROSS JOIN vscode_extensions USING (uid);"
    }
  }
}
