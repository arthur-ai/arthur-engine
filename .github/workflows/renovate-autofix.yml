name: Renovate Auto-Fix

# When "Arthur Engine CI" fails on a Renovate PR, let Claude adapt the source
# code to the updated dependency, verify the full required suite passes,
# self-review the change and address its own review findings, then push the fix
# and re-approve so the reviewed change re-enters the dev merge queue.
# (claude-code-review.yml additionally runs an independent review on the pushed
# fix commit.)
#
# Safety model (three layers):
#   1. Claude self-verifies: it re-runs the real checks and only signals success
#      (writes .claude-autofix-success) if everything passes; otherwise it
#      discards its edits and comments. Nothing broken is ever committed.
#   2. The merge queue + required checks are the hard gate: the pushed fix still
#      has to pass all 6 required checks on the PR AND on the merge-queue branch
#      before it can merge. This workflow cannot bypass that.
#   3. Scope/tool guards: runs only on renovate/* branches, only on CI failure,
#      a bounded retry budget (default 3 attempts, then it hands off to a human),
#      and a prompt bounded by invariants rather than a file allowlist. It forbids
#      weakening checks (the enforced rule set may never shrink), editing .github/
#      or /renovate.json, and bypassing the 3-day release-age soak. Dependency
#      constraints MAY be realigned — that is how a half-bumped lockstep family is
#      repaired — but never by downgrading or capping the package the PR is
#      updating, lockfiles are regenerated via uv/yarn rather than hand-edited, and
#      every constraint change must be declared in the self-review comment.
#
# Identity split (required by the ruleset's require_last_push_approval +
# dismiss_stale_reviews_on_push): the fix is PUSHED as the Arthur GitHub
# Automator App, and APPROVED as github-actions[bot] — two distinct actors,
# so the post-push approval is valid. The approval is pinned to the exact fix
# commit SHA (a bare approve races the push and gets dismissed as stale).
# Major-version PRs (labelled 'major' by Renovate) are fixed but NOT approved —
# they get their title flagged for human review instead.
#
# This is a workflow_run listener; it only becomes active once merged to the
# default branch (dev). It always runs the version of itself from the default
# branch, so a PR cannot tamper with the fixer that runs against it.

on:
  workflow_run:
    workflows: ["Arthur Engine CI"]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  autofix:
    # Only failed CI runs from a same-repo Renovate PR branch. All identity signals
    # matter and none is sufficient alone:
    #   - head_repository == this repo  -> reject fork-originated runs (this job holds
    #     write creds + an approver token; a fork must never reach it).
    #   - actor is a trusted bot        -> the failing run was pushed by Renovate OR by
    #     our own Automator App (the identity that pushes Claude's fix). Allowing the
    #     Automator App is what lets a failed *retry* re-trigger this job; a human who
    #     merely pushed a renovate/* branch is still rejected. (PR author re-checked below.)
    #   - head_branch renovate/*        -> narrows to dependency branches.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.actor.login == 'renovate[bot]' ||
        github.event.workflow_run.actor.login == 'arthur-github-automator-app[bot]'
      ) &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    # Bound the run. Without this the job inherits GitHub's 6h default, so a Claude
    # session that hangs burns a runner for hours. The budget has to cover reproducing
    # the failure, fixing, and re-running the full required suite (all four Python
    # linters + unit tests, or the three UI checks) twice.
    timeout-minutes: 90
    # Needed to read the Arthur GitHub Automator App credentials.
    environment: shared-protected-branch-secrets
    permissions:
      contents: write # push the fix commit
      pull-requests: write # approve + comment
      actions: read # read the failed CI logs
      id-token: write
    steps:
      - name: Generate Automator App token (push identity)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}
          private-key: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_PRIVATE_KEY }}

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          NUM='${{ github.event.workflow_run.pull_requests[0].number }}'
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            # Fallback for same-repo runs where the payload omits the PR link.
            # Constrained to Renovate-authored PRs so a colliding branch name can't
            # steer us onto someone else's PR.
            NUM=$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" \
              --author 'app/renovate' --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No open Renovate PR found for branch $HEAD_BRANCH; nothing to fix."
            exit 0
          fi
          # Defence in depth: confirm the PR really is Renovate-authored before this
          # job ever pushes to it or approves it.
          AUTHOR=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq '.user.login')
          if [ "$AUTHOR" != "renovate[bot]" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #$NUM author is '$AUTHOR', not renovate[bot]; refusing to act."
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # Push identity = the Automator App (distinct from the approver below).
          token: ${{ steps.app-token.outputs.token }}

      - name: Retry budget guard
        id: guard
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          # Each Claude fix adds one [claude-autofix] commit, so the count reachable
          # from HEAD is how many times Claude has already tried on this branch head.
          # This lets a failed fix be retried (with the new failure logs) up to the
          # budget, instead of giving up after a single attempt. A Renovate rebase
          # drops these commits and resets the budget, which is the desired behaviour.
          ATTEMPTS=$(git log --format=%s | grep -cF '[claude-autofix]' || true)
          echo "Prior auto-fix attempts on this branch: ${ATTEMPTS}/${MAX_ATTEMPTS}."
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Reached ${MAX_ATTEMPTS} auto-fix attempts; handing off to a human."
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "🤖 Auto-fix gave up after ${MAX_ATTEMPTS} attempts — CI is still failing on this dependency update. It needs a human." || true
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude auto-fix (edits + self-verify only; no commit)
        if: steps.guard.outputs.proceed == 'true'
        # The success marker lives OUTSIDE the repo (in RUNNER_TEMP) so it cannot be
        # committed to the PR branch to forge a "verified" signal.
        env:
          AUTOFIX_MARKER: ${{ runner.temp }}/claude-autofix-success
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow the action to run even though the PR was authored by a bot.
          allowed_bots: "renovate[bot]"
          additional_permissions: |
            actions: read
          # Opus at xhigh effort: these fixes require reading unfamiliar dependency
          # APIs and reasoning about breakage, and the same run also self-reviews.
          # Keep Claude to the tools it needs; no network mutations beyond gh/git.
          claude_args: '--model opus --effort xhigh --allowed-tools "Bash,Read,Edit,Write,Glob,Grep"'
          prompt: |
            A Renovate dependency-update PR (#${{ steps.pr.outputs.number }}) on this branch has FAILING CI.
            The failed run is: ${{ github.event.workflow_run.html_url }} (run id ${{ github.event.workflow_run.id }}).
            You are on the checked-out PR branch.

            ## HOW THIS SESSION WORKS — read this first

            This is a single non-interactive run. Nothing will wake you up: no human will reply, and no
            background task can hand control back to you. **The moment you stop producing output the
            session ends**, the runner is torn down, and everything in the working tree is thrown away —
            including a correct, finished fix.

            Therefore:
              - **Run every command in the FOREGROUND and let it block until it exits.** Never put a check
                in the background (`&`, `nohup`, background tasks, "I'll check on it shortly") and then wait
                for it. Waiting is how the run dies.
              - **Slow commands are expected and fine.** The Python unit suite and the UI checks take
                minutes; the budget accounts for that. Start it, block on it, read its exit status.
              - **There are exactly two valid ways to finish**: you wrote $AUTOFIX_MARKER, or you discarded
                your edits and posted a cannot-fix PR comment. Ending your turn in any other state —
                especially "waiting to confirm" — throws the work away and helps nobody.

            ## YOUR GOAL

            This PR exists to land the dependency updates in its description. Your job is to get it there:
            make every required check pass, with those updates still delivered, and nothing else broken.

            You are not restricted to a fixed list of allowed edits. Diagnose the real cause and fix it
            wherever it actually lives — application source, a test that encodes the dependency's old
            contract, a linter config that a plugin's changed API broke, or a dependency constraint that
            Renovate left inconsistent. What matters is not which file you touched but whether the
            INVARIANTS below still hold and your VERIFICATION genuinely proves it.

            NOTE: this may be a retry. If the branch already contains a `[claude-autofix]` commit, a
            previous attempt did not fully pass — the failing run above reflects what that fix got wrong.
            Read those logs, understand the remaining failure, and build on the prior fix rather than
            repeating it.

            ## INVARIANTS — every one must hold of your final diff

              1. **The update still lands.** Every package named in the PR description must end at or above
                 the version the PR set. Never downgrade, cap, or exclude the package being updated to make
                 the build go green — that turns the PR into a no-op while making it look fixed. When
                 packages conflict, move the LAGGING one forward, not the updated one back.
              2. **No check is weakened.** No eslint-disable, @ts-ignore/@ts-expect-error, `# type: ignore`,
                 pytest skip/xfail, deleted assertions, or coverage reductions. If a linter config must
                 change because a plugin moved or renamed its API, you may adapt it — but the set of rules
                 actually enforced must not shrink. If adapting it would drop rules that were previously
                 enforced, say so explicitly in your review comment rather than letting it pass silently.
              3. **No behaviour change beyond the adaptation.** Nothing opportunistic, no refactors, no
                 unrelated cleanups. Smallest change that achieves the goal.
              4. **Lockfiles are generated, never authored.** If resolution has to change, edit the declared
                 constraint (`genai-engine/pyproject.toml`, `genai-engine/ui/package.json`) and regenerate:
                 `uv lock --directory genai-engine` for Python, `cd genai-engine/ui && yarn install` for npm.
                 Never hand-edit `uv.lock` or `yarn.lock`.
              5. **The release-age soak is not yours to bypass.** `minimumReleaseAge` in /renovate.json and
                 `tool.uv exclude-newer` in the pyproject.toml files are deliberate. Do not remove, loosen,
                 or work around them, and do not pull in a release they exclude.
              6. **The rules that judge you are off limits.** Do not edit anything under .github/ or any CI
                 workflow, or /renovate.json. A fix that requires changing them is a fix a human must make —
                 see CANNOT-FIX below. (Linter configs under genai-engine/ are covered by invariant 2, not
                 by this one.)
              7. **Constraint edits are declared.** If your diff changes any dependency constraint, your
                 review comment must list each one (`package: old -> new`) and the resolver output that
                 forced it. Also try `gh pr edit ${{ steps.pr.outputs.number }} --add-label "autofix: dependency-realignment"`;
                 if that fails because the label does not exist, skip it and rely on the comment — do not
                 block on it. Constraint edits get the same scrutiny as code: the version you move to must
                 be the one the conflict actually demands, not the newest you can find.

            ## VERIFICATION — required, and it must be real

            A fix is not done because it looks right. Prove it:
              1. **Reproduce first.** From the failed run, identify each failing check and the exact command
                 it ran. Run that command in the foreground and watch it fail, so you know you are fixing
                 the right thing.
              2. **The failing check now passes.** Re-run that same command to completion.
              3. **Nothing new broke.** Run the other required checks covering what you touched — not just
                 the one that was red. All four Python linters gate the build, so run all four if you
                 touched Python; run type-check, lint and format:check if you touched the UI.
              4. **Invariants are checked, not assumed.** Read your own `git diff`. Confirm invariant 1 by
                 inspecting the constraint diff directly: no package in the PR description sits below its
                 target version.

            Commands (confirm each against the failed run's log — it shows what actually ran):
              - Python deps: `uv sync --directory genai-engine --frozen --group dev --group linters`
                (drop `--frozen` after a deliberate constraint change, then re-lock).
              - Python lint: `uv run --directory genai-engine isort src --profile black --check`,
                `... autoflake --remove-all-unused-imports --check --recursive --quiet src`,
                `... black --check src`, `... mypy src`
              - Python tests: `uv run --directory genai-engine pytest -m unit_tests`
              - Python fixers: `uv run --directory genai-engine isort src --profile black`,
                `... autoflake --remove-all-unused-imports --in-place --recursive src`, `... black src`
              - UI: `cd genai-engine/ui && corepack enable && yarn install --immutable`, then
                `yarn type-check && yarn lint && yarn format:check` (fixer: `yarn format`)
              - Lockfile drift: `.github/scripts/check-lockfile-drift.sh` (every uv project at once)

            ## IF THE FAILING CHECK IS `check-dependency-automation`

            This one has a specific cause, so do not treat it as a generic red check. Renovate updates
            pyproject.toml and regenerates uv.lock in a separate step; when that second step fails it
            opens the PR with the manifest edit ALONE. The script prints which of two states it found,
            and they need opposite responses:

              - **STALE** — the manifest resolves, the lock just was not regenerated. This is the easy
                case and it IS your job: run `uv lock --directory <project>` for each project it names,
                confirm the diff contains the update the PR is for, and carry on. Nothing else to fix.
              - **UNRESOLVABLE** — no lockfile can satisfy the manifest, so re-locking will not help.
                The resolver output names both sides. If the package blocking the update has a release
                that accepts the new version, bump that one too (invariant 1: move the LAGGING package
                forward, never cap or downgrade the one the PR is updating). If no such release exists,
                you cannot fix this — see below.

            ## WHEN YOU CANNOT REACH THE GOAL

            Some failures genuinely need a human. In every such case: run `git checkout -- . && git clean -fd`
            to discard all edits, do NOT write the marker, and post a PR comment
            (`gh pr comment ${{ steps.pr.outputs.number }} -b "..."`) naming the specific blocker and what
            would resolve it. Never leave partial edits behind.

            This includes any case where the only path to green would break an invariant — for example a
            required version does not exist yet, two updates in the PR are mutually incompatible at every
            available version, or the fix would have to change CI config or /renovate.json.

            **Transitive ceiling** — the case where an UNRESOLVABLE manifest has no fix at any available
            version: something else we pin caps the package this PR is updating, and no release of that
            blocker accepts the new version yet. The update simply cannot land, and Renovate will keep
            re-proposing it every run until told otherwise. Telling it otherwise means an `allowedVersions`
            rule in /renovate.json, which invariant 6 forbids you from touching — so hand it over cleanly.
            Say in your comment: the package and version being proposed, the pinned dependency that caps
            it and the exact range it requires, that you verified no newer release of that blocker lifts
            the cap, and the `allowedVersions` value a human should add. This is what should have happened
            for openai 3.0.0 against litellm's `openai<3.0.0` (PR #2134).

            **Release-age soak** — flag this one precisely. The blocker is that a NEWER release WOULD fix the
            build but is held back by the 3-day soak (invariant 5). Tell-tale signs: `uv lock` reports the
            fixing version is unavailable / "not at the requested version", OR a package imports a symbol
            that a just-updated dependency renamed/removed and that dependency's compat patch was published
            less than 3 days ago. In addition to the explanatory comment, label it:
            `gh pr edit ${{ steps.pr.outputs.number }} --add-label "blocked: release-age soak"` so humans see
            it is a timing hold, not a defect. In the comment, name the package, the exact version that fixes
            it, and the UTC timestamp it clears the soak (the fixing release's upload time + 3 days).

            ## PROCESS

              1. Read the failures: `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
                 Reproduce per VERIFICATION step 1.
              2. Diagnose the ROOT CAUSE. For a resolver conflict, read the resolver's own explanation — it
                 names the packages and the versions each one demands; that tells you which constraint is
                 lagging and what it must become.
              3. Make the smallest change that reaches the goal.
              4. VERIFY: all four steps above. Every relevant check green.
              5. SELF-REVIEW your diff as a critical, adversarial reviewer — this review gates the merge.
                 Run `git diff` and judge: (a) does it genuinely address the cause rather than mask the
                 symptom? (b) does every INVARIANT hold — check them one by one, especially 1 and 2?
                 (c) any correctness bug? (d) is it minimal? Post a short review summary (findings + verdict,
                 plus the invariant-7 constraint list if applicable) as a PR comment:
                 `gh pr comment ${{ steps.pr.outputs.number }} -b "..."`.
              6. ADDRESS every actionable finding, then RE-RUN all relevant checks and confirm they still
                 pass. Repeat review -> address until your review has no unaddressed actionable findings.
              7. ONLY IF all checks pass AND your review is clean: write the file at the path in the env var
                 $AUTOFIX_MARKER (it is OUTSIDE the repo — run `echo ok > "$AUTOFIX_MARKER"`), and leave your
                 edits in the working tree. DO NOT commit or push, and do NOT create any marker file inside
                 the repo.

            A later step commits & pushes ONLY if $AUTOFIX_MARKER exists, so the marker means "goal reached,
            invariants hold, verified, self-reviewed, and review findings addressed". The change still goes
            through the full CI + merge queue (and an independent Claude review) before merging. Never leave
            broken, unreviewed, or unverified edits.

      - name: Commit, push, then approve (minor/patch) or flag (major)
        if: steps.guard.outputs.proceed == 'true'
        env:
          # Approve as github-actions[bot] — a DIFFERENT identity than the app that
          # pushes below, so require_last_push_approval is satisfied.
          GH_TOKEN: ${{ github.token }}
          # Used ONLY for the push, so GitHub attributes the push to the Automator App.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTOFIX_MARKER: ${{ runner.temp }}/claude-autofix-success
        run: |
          set -euo pipefail
          if [ ! -f "$AUTOFIX_MARKER" ]; then
            echo "No verified fix was produced; leaving the PR for a human."
            exit 0
          fi
          # Use porcelain so NEW (untracked) files — e.g. a new ambient .d.ts that fixes
          # a type error — count as a change; `git diff` alone would miss them and
          # silently drop a valid fix.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Success marker present but no file changes; nothing to push."
            exit 0
          fi

          git config user.name "arthur-github-automator[bot]"
          git config user.email "${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}+arthur-github-automator[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deps): auto-resolve CI failures from dependency update [claude-autofix]"
          FIX_SHA=$(git rev-parse HEAD)

          # Push with the app token EXPLICITLY (checkout's persisted credential is gone —
          # claude-code-action rewrites the workspace git auth during its run). The push is
          # x-access-token, so GitHub attributes it to the Automator App (distinct from the
          # approver). NOT a force push: if Renovate rebased this branch while Claude worked,
          # this is a non-fast-forward and is rejected — safe, a newer run handles the new head.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:$HEAD_BRANCH"

          # Major-version bumps are labelled 'major' by Renovate. For those we adapt the code
          # so CI passes, but do NOT self-approve — a human must review the major bump. We flag
          # the title instead.
          IS_MAJOR=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "major")')
          if [ "$IS_MAJOR" = "true" ]; then
            TITLE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title --jq '.title')
            case "$TITLE" in
              "⚠️ major update"*) : ;;  # already flagged on a previous attempt; don't stack
              *) gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" \
                   --title "⚠️ major update — human review required: $TITLE" ;;
            esac
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "🤖 Applied an auto-fix so CI passes, but this is a **major** dependency update, so it is **not** being auto-approved. A human should review and approve before it merges."
            echo "Major update: flagged title, skipped self-approval."
            exit 0
          fi

          # Minor/patch: approve the EXACT fix commit and CONFIRM the approval sticks.
          # Why this dance: a bare `gh pr review --approve` right after a push races GitHub —
          # the approval can attach to the PRE-push commit, which dismiss_stale_reviews_on_push
          # then dismisses (observed on #2070: approval landed on the old SHA and was dismissed
          # 1s later). This loop does not trust that reasoning; it verifies the END STATE:
          #   (a) wait until GitHub reports FIX_SHA as the PR head,
          #   (b) approve pinned to FIX_SHA,
          #   (c) re-read reviews and confirm a NON-dismissed APPROVED review on FIX_SHA exists,
          #   retrying if not. If the head has moved on to some other commit (a newer push
          #   superseded us), FIX_SHA never becomes head and we exit without approving a stale
          #   commit — a newer run/human owns it.
          approved=false
          for attempt in 1 2 3 4 5 6; do
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha' || echo "")
            if [ "$HEAD_SHA" != "$FIX_SHA" ]; then
              echo "PR head is ${HEAD_SHA:-unknown}, waiting for our fix $FIX_SHA to register (attempt $attempt/6)..."
              sleep 5
              continue
            fi
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
              -f commit_id="$FIX_SHA" -f event="APPROVE" \
              -f body="🤖 Auto-fix verified: adapted the code to the dependency update and confirmed the full required suite passes locally. Approving $FIX_SHA to re-enter the merge queue." >/dev/null || true
            sleep 4
            STUCK=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
              | jq -r --arg sha "$FIX_SHA" 'any(.[]; .user.login=="github-actions[bot]" and .state=="APPROVED" and .commit_id==$sha)')
            if [ "$STUCK" = "true" ]; then approved=true; echo "Approval confirmed sticking on $FIX_SHA."; break; fi
            echo "Approval did not stick yet (attempt $attempt/6); retrying..."
          done
          if [ "$approved" != "true" ]; then
            echo "::warning::Could not confirm a sticking approval on $FIX_SHA after retries; leaving it for a human to approve."
          fi
