name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Review human PRs (skip pure Renovate syncs), PLUS review Renovate PRs the
    # instant our Automator App pushes a Claude auto-fix to them — so code Claude
    # wrote on a dependency PR always gets a review pass. The auto-fixer also does an
    # inline review-and-address gate before it approves; this is the independent,
    # fresh-context second look.
    #
    # GitHub App bots use login 'renovate[bot]'; legacy/self-hosted may use 'renovate'.
    # Check both the PR author AND the triggering actor: Renovate can rebase/synchronize
    # a PR opened by another bot (e.g. the version-bump app), which makes github.actor
    # 'renovate[bot]' while pull_request.user.login stays the original author. The
    # claude-code-action gates on the triggering actor, so guarding only on the author
    # lets the job run and then fail with "Workflow initiated by non-human actor: renovate".
    if: >-
      (
        github.event.pull_request.user.login != 'renovate' &&
        github.event.pull_request.user.login != 'renovate[bot]' &&
        github.actor != 'renovate' &&
        github.actor != 'renovate[bot]'
      ) ||
      github.actor == 'arthur-github-automator-app[bot]'

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bots whose PRs we still want reviewed. The action strips a trailing
          # '[bot]' before matching, so bare logins are correct here.
          # 'claude' is the Claude-in-Slack / Claude Code web app: PRs it opens are
          # Claude-authored code, exactly what this job exists to give a second look.
          allowed_bots: 'arthur-github-automator-app,arthur-blazity-ai-workflow,claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # Example prompts and configurations: https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
          # CLI flags: https://code.claude.com/docs/en/cli-reference
          # Code review plugin: https://github.com/anthropics/claude-code/tree/main/plugins/code-review
