name: Build FS Model Upload Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image after build"
        type: boolean
        required: false
        default: true
      image:
        description: "Image name (e.g. arthurplatform/genai-engine-models-fs)"
        type: string
        required: false
        default: "arthurplatform/genai-engine-models-fs"
  workflow_call:
    inputs:
      push:
        description: "Push image after build"
        type: boolean
        required: false
        default: true
      image:
        description: "Image name (e.g. arthurplatform/genai-engine-models-fs)"
        type: string
        required: false
        default: "arthurplatform/genai-engine-models-fs"

jobs:
  build-fs-model-upload:
    environment: shared-protected-branch-secrets
    # security-events: write is what lets the scan below publish SARIF to the
    # Security tab. A reusable workflow cannot grant itself more than its caller
    # holds, so the calling job in arthur-engine-workflow.yml declares the same set.
    #
    # contents: read is deliberate and does not affect the manifest commit further
    # down: checkout, the git push and gh all run on the Arthur Automator App token,
    # not GITHUB_TOKEN. The only thing here that touches github.token is the Trivy
    # installer fetching a public release. Declaring any permissions block at all
    # drops the unlisted scopes to none, hence spelling out all three.
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Generate Arthur GitHub Automator App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}
          private-key: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_PRIVATE_KEY }}
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
        with:
          version-prefix: "genai-engine-"
      - name: Use test suffix for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          echo "VERSION=${VERSION%-dev}-test" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
      - name: Build (and optionally push) docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: "{{defaultContext}}:deployment/model-upload"
          file: Dockerfile
          build-args: |
            BACKEND=fs
            AIBOM_VERSION=${{ env.VERSION }}
          target: runtime-fs
          tags: |
            ${{ inputs.image }}:${{ env.VERSION }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', inputs.image) || '' }}
            ${{ github.ref == 'refs/heads/dev' && format('{0}:latest-dev', inputs.image) || '' }}
          push: ${{ inputs.push }}
          platforms: linux/amd64
          # Attach a CycloneDX SBOM attestation to the pushed image, consumable via
          # `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'`.
          sbom: true
      - name: Update models manifest
        run: |
          cd deployment/model-upload
          python check_model_updates.py --update
      - name: Generate AIBOM
        run: |
          cd deployment/model-upload
          # Deterministic catalog copy: HuggingFace LFS hashes + license/task, no timestamp.
          python generate_aibom.py --no-timestamp --no-engine-version --output aibom.cdx.json
      - name: Commit updated manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          export GH_TOKEN=${{ steps.generate-token.outputs.token }}
          git add deployment/model-upload/models-manifest.json deployment/model-upload/aibom.cdx.json
          # Nothing to do if another job already committed the same update.
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          # Commit BEFORE pulling so the working tree is clean and `pull --rebase` won't abort
          # with "cannot pull with rebase: You have unstaged changes".
          git commit --no-verify -m "Update models manifest [skip ci]"
          # dev is a shared branch; rebase our commit onto any concurrent pushes, then push.
          # Retry because the branch can advance again between the pull and the push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" \
               && git push origin "${{ github.ref_name }}"; then
              echo "Manifest pushed (attempt ${attempt})."
              exit 0
            fi
            echo "Push attempt ${attempt} failed (branch advanced?); retrying in 5s..."
            sleep 5
          done
          echo "Failed to push manifest after retries." >&2
          exit 1
      # Advisory vulnerability scan + justification docs, matching what the
      # genai-engine and ml-engine builds already do. Without this the models
      # images were only ever scanned by the nightly image-vuln-scan, so a fix
      # merged just after a release sat visibly "open" in the Security tab for up
      # to a day after it had actually shipped.
      #
      # The slug is the SARIF category, so it must stay identical to this image's
      # entry in the image-vuln-scan.yml matrix (models-fs); a different category
      # would open a second, parallel set of alerts instead of updating these.
      #
      # Runs last: the scan takes minutes, and the manifest commit above races
      # other jobs pushing to the same branch, so this keeps that window tight.
      # Only meaningful when the image was pushed -- the scan pulls it by tag.
      - name: Scan image & generate justification docs
        if: inputs.push
        continue-on-error: true
        uses: ./.github/workflows/composite-actions/vuln-report
        with:
          image: ${{ inputs.image }}:${{ env.VERSION }}
          slug: models-fs
          dockerhub-username: ${{ secrets.DOCKERHUB_ENTERPRISE_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_ENTERPRISE_TOKEN }}
