name: Endpoint AI Discovery CI

# lint.sh READS both collectors; the macOS and Linux jobs RUN them. Both are needed: a static
# check cannot catch a shell bug that only fires on a real machine, and the deployable is bash
# against a stock system.
#
# The queries, the runner and the Docker guard are vendored at a pinned ref and tested by
# upstream. Do not re-create that suite here.

on:
  pull_request:
    paths:
      - 'integrations/endpoint-ai-discovery/**'
      - '.github/workflows/endpoint-ai-discovery.yml'
      # lint.sh holds the EC2 reporter's wire format to the reader's, and the template's member
      # role to the calls the reader makes and the role name the connector defaults to.
      - 'ml-engine/src/ml_engine/discovery/cloud/ec2/client.py'
      - 'ml-engine/src/ml_engine/discovery/cloud/ec2/connector.py'
  push:
    branches: [dev, main]
    paths:
      - 'integrations/endpoint-ai-discovery/**'
      - '.github/workflows/endpoint-ai-discovery.yml'
      # lint.sh holds the EC2 reporter's wire format to the reader's, and the template's member
      # role to the calls the reader makes and the role name the connector defaults to.
      - 'ml-engine/src/ml_engine/discovery/cloud/ec2/client.py'
      - 'ml-engine/src/ml_engine/discovery/cloud/ec2/connector.py'
  workflow_dispatch:

# Read-only, and not left in the checkout. The macOS job runs the checked-out
# test/run-collector.sh as root, so a write-capable token persisted into .git/config by
# actions/checkout would be readable by it.
permissions:
  contents: read

concurrency:
  group: endpoint-ai-discovery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: integrations/endpoint-ai-discovery

jobs:
  lint:
    name: Static checks
    # No osquery and no Mac needed: this reads files. Cheap enough to gate every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: test/lint.sh
        run: test/lint.sh

      # CloudFormation's own schema on the template as committed: resource types, properties,
      # intrinsic functions, conditions and rules. A placeholder is a plain string to it.
      - name: cfn-lint
        run: pipx run --spec cfn-lint==1.58.0 cfn-lint deploy/arthur-ai-discovery.cfn.yaml

      # The Compute Engine reporter against a fake metadata server built from measured
      # answers. No osquery: the collector is a stub, and the question is what is published.
      - name: test/run-guest-attributes.sh
        run: test/run-guest-attributes.sh

      # The EC2 reporter against a fake IMDS. No osquery and no SSM Agent: the collector is
      # a stub, and the question is the custom inventory file it writes.
      - name: test/run-ssm-inventory.sh
        run: test/run-ssm-inventory.sh

      # The collector embeds the darwin artifact alone, so it must refuse elsewhere by
      # name rather than by failing on a missing file. Asserts on the artifact the message
      # names, not on its wording -- the wording is upstream's to change.
      - name: The collector refuses to run off macOS, and says why
        run: |
          set +e
          out="$(dist/collect.sh 2>&1)"; status=$?
          set -e
          echo "$out"
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1 on Linux, got $status"; exit 1; }
          case "$out" in
            *discovery-darwin.sql*) echo "ok: refused, naming the artifact it carries" ;;
            *) echo "::error::the refusal does not name the cause"; exit 1 ;;
          esac

  terraform:
    name: The Compute Engine Terraform module
    # Against mocked providers: no credentials, nothing created. It checks what the module
    # renders -- the policy file, pinned to the bytes beside it, in the right scope. Whether VM
    # Manager applies it is the runbook's check, on a real VM.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/endpoint-ai-discovery/deploy/terraform
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  terraform-floor:
    name: The Compute Engine Terraform module, at its lowest admitted versions
    # versions.tf admits Terraform from 1.5 and the Google provider from 6.33, and the job above
    # runs a recent Terraform and the latest provider. An attribute or a function added since
    # passes there and breaks a caller pinned at a floor, so validate a caller at both, in all
    # three modes. Validate only: terraform test needs 1.7.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/endpoint-ai-discovery/deploy/terraform
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: versions.tf still names this Terraform as its floor
        run: |
          floor="$(sed -n 's/.*required_version *= *">= *\([0-9.]*\)".*/\1/p' versions.tf)"
          running="$(terraform version -json | jq -r .terraform_version)"
          case "$running" in "$floor" | "$floor".*) echo "Terraform $running is the floor $floor" ;;
            *) echo "::error::versions.tf admits Terraform from '$floor', but this job runs $running"; exit 1 ;; esac

      # By relative path: an absolute path to the module's own directory leaves the policy file
      # beside it out of reach.
      - name: terraform validate at the Google provider floor
        run: |
          floor="$(awk '/google *= *\{/ { g = 1 } g && /version/ { sub(/.*">= */, ""); sub(/,.*/, ""); print; exit }' versions.tf)"
          case "$floor" in [0-9]*.[0-9]*) ;; *) echo "::error::cannot read the google floor from versions.tf"; exit 1 ;; esac
          caller="$RUNNER_TEMP/floor"
          mkdir -p "$caller"
          module="$(realpath --relative-to="$caller" .)"
          cat > "$caller/main.tf" <<EOF
          terraform {
            required_providers {
              google = { source = "hashicorp/google", version = "= $floor" }
            }
          }
          module "zones" {
            source            = "$module"
            arthur_engine_ref = "x"
            projects          = ["fleet-one"]
            zones             = ["us-central1-a"]
          }
          module "folder" {
            source            = "$module"
            arthur_engine_ref = "x"
            projects          = ["fleet-one"]
            zones             = ["us-central1-a"]
            orchestrator      = { folder = "1" }
          }
          module "organization" {
            source            = "$module"
            arthur_engine_ref = "x"
            projects          = ["fleet-one"]
            zones             = ["us-central1-a"]
            orchestrator      = { organization = "2", action = "DELETE" }
          }
          EOF
          cd "$caller"
          terraform init -backend=false -input=false
          terraform validate
          selected="$(terraform version -json | jq -r '.provider_selections["registry.terraform.io/hashicorp/google"]')"
          echo "validated with google $selected"
          case "$selected" in "$floor" | "$floor".0) ;; *) echo "::error::validated $selected, not the floor $floor"; exit 1 ;; esac

  collector:
    name: The deployable, run on a Mac
    # Pinned rather than macos-latest: the prerequisite claim -- osquery and nothing else
    # -- is a claim about a stock Mac, so a reissued image is drift worth catching.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The version upstream tests against. osquery has no per-query timeout, so the
      # wall-clock bound is a property of this release rather than of osquery.
      - name: Install osquery
        run: |
          curl -fsSL -o /tmp/osquery.pkg \
            "https://pkg.osquery.io/darwin/osquery-${OSQUERY_VERSION}.pkg"
          sudo installer -pkg /tmp/osquery.pkg -target /
        env:
          OSQUERY_VERSION: 5.23.1

      # As root, because an MDM policy runs it as root. The script works unprivileged,
      # but the row count depends on it. ~15s.
      - name: test/run-collector.sh
        run: sudo -n test/run-collector.sh

      - name: The Linux collector refuses to run on macOS, and says why
        run: |
          set +e
          out="$(dist/collect-linux.sh 2>&1)"; status=$?
          set -e
          echo "$out"
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1 on macOS, got $status"; exit 1; }
          case "$out" in
            *discovery-linux.sql*) echo "ok: refused, naming the artifact it carries" ;;
            *) echo "::error::the refusal does not name the cause"; exit 1 ;;
          esac

      # A hosted runner has no Docker, so the container branch reports `absent` and the
      # 15s cold-ping bound is never reached. Daemon states are upstream's
      # osquery/test/docker_states.sh.
      - name: What this job did not prove
        run: |
          echo "no Docker on a hosted runner, so the container branch reported absent"
          echo "rather than ok, and the 15s cold-ping bound was never reached"

  collector-linux:
    name: The Linux deployable, run under systemd
    # A hosted runner has systemd as PID 1, which a container does not -- the units are what
    # this job is for. The Debian 12 VM in docs/mdm/gce.md is the acceptance check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install osquery
        run: |
          curl --retry 3 -fsSL -o /tmp/osquery.deb \
            "https://pkg.osquery.io/deb/osquery_${OSQUERY_VERSION}-1.linux_amd64.deb"
          sudo dpkg -i /tmp/osquery.deb
          osqueryi --version
        env:
          OSQUERY_VERSION: 5.23.1

      - name: test/run-collector.sh
        run: sudo -n test/run-collector.sh

      # Installs the collector, the reporter and the units at their real paths, runs them
      # under systemd against the fake metadata server, and removes them again.
      - name: test/run-systemd.sh
        run: sudo -n env ARTHUR_TEST_INSTALLS_UNITS=1 test/run-systemd.sh

      # The EC2 install script as a stack ships it, run twice as root under sh -- dash here, as
      # on every Ubuntu instance -- against this checkout over file://. Rendered first, as the
      # runner: git refuses root a checkout it does not own.
      - name: test/run-ec2-install.sh
        run: |
          tools/render-cfn-template.sh HEAD > "$RUNNER_TEMP/arthur-ai-discovery.cfn.yaml"
          sudo -n env ARTHUR_TEST_INSTALLS_UNITS=1 test/run-ec2-install.sh "$RUNNER_TEMP/arthur-ai-discovery.cfn.yaml"
