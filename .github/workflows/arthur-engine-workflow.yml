name: Arthur Engine CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # Required for the `dev` merge queue: GitHub runs the required checks on a
  # temporary `gh-readonly-queue/dev/...` branch via the merge_group event.
  # Without this trigger the queue would never see the checks and would stall.
  merge_group:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA for testing"
        required: false
        default: ""
        type: string

jobs:
  run-genai-engine-linter:
    needs: check-genai-engine-changes
    if: needs.check-genai-engine-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: python:3.12.9-bullseye
    env:
      SKIP: pytest-check,changelog-check
      GIT_DEPTH: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: genai-engine
          with-groups: dev,linters
      - name: Run isort
        id: isort
        continue-on-error: true
        run: |
          uv run --directory genai-engine isort src --profile black --check
      - name: Run autoflake
        id: autoflake
        continue-on-error: true
        run: |
          uv run --directory genai-engine autoflake --remove-all-unused-imports --in-place --check --recursive --quiet src
      - name: Run black
        id: black
        continue-on-error: true
        run: |
          uv run --directory genai-engine black --check src
      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          uv run --directory genai-engine mypy src
      - name: Check linter results
        if: steps.isort.outcome == 'failure' || steps.autoflake.outcome == 'failure' || steps.black.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: |
          echo "One or more linters failed"
          exit 1

  run-ml-engine-linter:
    needs: check-ml-engine-changes
    if: needs.check-ml-engine-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: python:3.13-bullseye
    env:
      SKIP: pytest-check,changelog-check
      GIT_DEPTH: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: ml-engine
          with-groups: linters
      - name: Generate GenAI Client
        run: |
          pip install 'openapi-generator-cli[jdk4py]==7.12'
          openapi-generator-cli generate -c ml-engine/scripts/openapitools.json
          sed -i 's/license = "NoLicense"/license = "Unlicense"/g' ./ml-engine/src/genai_client/pyproject.toml
          uv pip install --python ml-engine/.venv ./ml-engine/src/genai_client
      - name: Run isort
        id: isort
        continue-on-error: true
        run: |
          uv run --directory ml-engine isort src/ml_engine --profile black --check
      - name: Run autoflake
        id: autoflake
        continue-on-error: true
        run: |
          uv run --directory ml-engine autoflake --remove-all-unused-imports --in-place --check --recursive --quiet src/ml_engine
      - name: Run black
        id: black
        continue-on-error: true
        run: |
          uv run --directory ml-engine black --check src/ml_engine
      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          uv run --directory ml-engine mypy src/ml_engine
      - name: Check linter results
        if: steps.isort.outcome == 'failure' || steps.autoflake.outcome == 'failure' || steps.black.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: |
          echo "One or more linters failed"
          exit 1

  run-genai-engine-changelog-cop:
    needs: check-genai-engine-changes
    if: needs.check-genai-engine-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: python:3.12.9-bullseye
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: genai-engine
      - name: Install oasdiff
        run: |
          curl -L -o "oasdiff.deb" https://github.com/Tufin/oasdiff/releases/download/v1.11.7/oasdiff_1.11.7_linux_amd64.deb
          dpkg -i oasdiff.deb
      - name: Generate changelog
        env:
          GENAI_ENGINE_SECRET_STORE_KEY: changeme_secret_store_key
          # Generate the spec with all feature-flagged routes registered so
          # the documented API surface matches what demo deployments expose.
          GENAI_ENGINE_DEMO_MODE: ENABLED
          PYTHONPATH: src
        run: |
          uv run --directory genai-engine generate_changelog
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: changelog-artifacts
          path: |
            genai-engine/new.openapi.json
            genai-engine/staging.openapi.json
            genai-engine/src/api_changelog.md

  check-genai-engine-changes:
    if: |
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref_type == 'branch')
      ) &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      ui: ${{ steps.decide.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v2
        id: changes
        if: github.event_name != 'merge_group'
        with:
          filters: |
            ui:
              - 'genai-engine/ui/**'
            backend:
              - 'genai-engine/src/**'
              - 'genai-engine/tests/**'
              - 'genai-engine/alembic/**'
              - 'genai-engine/scripts/**'
              - 'genai-engine/models/**'
              - 'genai-engine/*.toml'
              - 'genai-engine/*.cfg'
              - 'genai-engine/*.ini'
              - 'genai-engine/*.lock'
              - 'genai-engine/*.txt'
              - 'genai-engine/version'
              - 'genai-engine/routes_security_check.py'
              - 'genai-engine/changelog*'
              - 'genai-engine/Dockerfile*'
              - 'genai-engine/docker-compose.yml'
              - 'arthur-observability-sdk/**'
      # In the merge queue there is no PR base to diff against, and paths-filter's
      # base detection is unreliable on merge_group. Run the full required suite as
      # the final pre-merge gate instead of trying to narrow it by path.
      - name: Decide affected areas
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.changes.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "ui=${{ steps.changes.outputs.ui }}" >> "$GITHUB_OUTPUT"
          fi

  check-ml-engine-changes:
    if: |
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref_type == 'branch')
      ) &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v2
        id: changes
        if: github.event_name != 'merge_group'
        with:
          filters: |
            changed:
              - 'ml-engine/**'
              - 'arthur-observability-sdk/**'
              - 'genai-engine/staging.openapi.json'
      # In the merge queue, run the full required suite (see note above).
      - name: Decide affected areas
        id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=${{ steps.changes.outputs.changed }}" >> "$GITHUB_OUTPUT"
          fi

  run-genai-engine-ui-lint:
    needs: check-genai-engine-changes
    if: |
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref_type == 'branch')
      ) &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/dev' &&
      needs.check-genai-engine-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLAB_UNIFY_FRONTEND_TOKEN: ${{ secrets.GITLAB_UNIFY_FRONTEND_TOKEN }}
    defaults:
      run:
        working-directory: genai-engine/ui
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        env:
          YARN_ENABLE_INLINE_BUILDS: "1"
          YARN_ENABLE_PROGRESS_BARS: "false"
          YARN_HTTP_TIMEOUT: "120000"
          YARN_HTTP_RETRY: "5"
        run: yarn install --immutable --inline-builds
      - name: Run type-check
        id: type-check
        continue-on-error: true
        run: yarn type-check
      - name: Run lint
        id: lint
        continue-on-error: true
        run: yarn lint
      - name: Run format check
        id: format-check
        continue-on-error: true
        run: yarn format:check
      - name: Run tests
        id: tests
        continue-on-error: true
        run: yarn test:run
      - name: Check results
        if: steps.type-check.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.format-check.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "One or more checks failed:"
          echo "  type-check: ${{ steps.type-check.outcome }}"
          echo "  lint: ${{ steps.lint.outcome }}"
          echo "  format-check: ${{ steps.format-check.outcome }}"
          echo "  tests: ${{ steps.tests.outcome }}"
          exit 1

  run-genai-engine-unit-tests:
    needs: check-genai-engine-changes
    if: |
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref_type == 'branch')
      ) &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/dev' &&
      needs.check-genai-engine-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: python:3.12.9-bullseye
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: genai-engine
      - name: Run unit tests
        shell: bash
        env:
          GENAI_ENGINE_SECRET_STORE_KEY: changeme_secret_store_key
        run: |
          set -o pipefail
          uv run --directory genai-engine pytest --cov --cov=src \
            --cov-report term \
            --junitxml=report.xml \
            -m "unit_tests" | tee pytest-coverage.txt
      - name: Pytest coverage comment
        if: always()
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: pytest-coverage.txt
          junitxml-path: genai-engine/report.xml
          title: Coverage Report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            genai-engine/report.xml
            pytest-coverage.txt

  run-genai-engine-alembic-migration-check:
    needs: check-genai-engine-changes
    if: needs.check-genai-engine-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: python:3.12.9-bullseye
    services:
      postgres:
        image: postgres:15
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: changeme_pg_password
          POSTGRES_DB: arthur_genai_engine
        volumes:
          - postgres_data:/var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: genai-engine
      - name: Run alembic migration check
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme_pg_password
          POSTGRES_URL: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: arthur_genai_engine
          POSTGRES_USE_SSL: false
          GENAI_ENGINE_SECRET_STORE_KEY: changeme_secret_store_key
          PYTHONPATH: "src:$PYTHONPATH"
        run: |
          cd genai-engine
          uv run alembic upgrade head

  run-ml-engine-unit-tests:
    needs: check-ml-engine-changes
    if: needs.check-ml-engine-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: python:3.13-bullseye
    env:
      SKIP: pytest-check,changelog-check
      GIT_DEPTH: 100
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
        with:
          working-directory: ml-engine
      - name: Generate GenAI Client
        run: |
          pip install 'openapi-generator-cli[jdk4py]==7.12'
          openapi-generator-cli generate -g python \
            -i ./genai-engine/staging.openapi.json \
            -o ./ml-engine/src/genai_client \
            --skip-validate-spec --package-name genai_client
      - name: Run unit-tests
        run: |
          uv run --directory ml-engine pytest tests/unit

  build-genai-engine-docker-images:
    environment: shared-protected-branch-secrets
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        torch_device: [cpu, gpu]
    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
        with:
          version-prefix: "genai-engine-"
      - name: Set up QEMU
        if: matrix.torch_device == 'cpu'
        uses: docker/setup-qemu-action@v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: "{{defaultContext}}:genai-engine"
          file: dockerfile
          build-args: |
            TORCH_DEVICE=${{ matrix.torch_device }}
            ENABLE_TELEMETRY=${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
            METICULOUS_RECORDING_TOKEN=${{ secrets.METICULOUS_RECORDING_TOKEN }}
            METICULOUS_API_TOKEN=${{ secrets.METICULOUS_API_TOKEN }}
            GITLAB_UNIFY_FRONTEND_TOKEN=${{ secrets.GITLAB_UNIFY_FRONTEND_TOKEN }}
            AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}
            VITE_AMPLITUDE_DEPLOYMENT_KEY=${{ secrets.AMPLITUDE_DEPLOYMENT_KEY }}
            VITE_AMPLITUDE_REPLAY_SAMPLE_RATE=${{ vars.AMPLITUDE_REPLAY_SAMPLE_RATE }}
            RECAPTCHA_ENTERPRISE_SITE_KEY=${{ secrets.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          tags: |
            arthurplatform/genai-engine-${{ matrix.torch_device }}:${{ env.VERSION }}
            ${{ github.ref == 'refs/heads/main' && format('arthurplatform/genai-engine-{0}:latest', matrix.torch_device) || '' }}
            ${{ github.ref == 'refs/heads/dev' && format('arthurplatform/genai-engine-{0}:latest-dev', matrix.torch_device) || '' }}
          push: true
          platforms: ${{ matrix.torch_device == 'cpu' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # Attach a CycloneDX SBOM attestation to the pushed image, consumable via
          # `docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'`.
          # SBOM only — do NOT add `provenance: mode=max` here: the build-args above carry
          # secrets (Meticulous/GitLab/Amplitude/reCAPTCHA tokens) and mode=max records
          # build-arg values into the provenance attestation on this public image.
          sbom: true
      # Advisory vulnerability scan + justification docs (must never fail the release build).
      - name: Scan image & generate justification docs
        continue-on-error: true
        uses: ./.github/workflows/composite-actions/vuln-report
        with:
          image: arthurplatform/genai-engine-${{ matrix.torch_device }}:${{ env.VERSION }}
          slug: genai-${{ matrix.torch_device }}
          dockerhub-username: ${{ secrets.DOCKERHUB_ENTERPRISE_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_ENTERPRISE_TOKEN }}

  build-ml-engine-docker-images:
    environment: shared-protected-branch-secrets
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
      - name: Generate GenAI Client
        run: |
          pip install 'openapi-generator-cli[jdk4py]==7.12'
          openapi-generator-cli generate -c ml-engine/scripts/openapitools.json
          sed -i 's/license = "NoLicense"/license = "Unlicense"/g' ./ml-engine/src/genai_client/pyproject.toml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
      # buildx (not plain `docker build`) so we can attach a CycloneDX SBOM attestation to the
      # image — consumable via `docker buildx imagetools inspect --format '{{ json .SBOM }}'`.
      # SBOM only (no provenance): keep parity with the genai-engine build.
      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ml-engine
          file: ml-engine/Dockerfile
          tags: |
            arthurplatform/ml-engine:${{ env.VERSION }}
            ${{ github.ref == 'refs/heads/main' && 'arthurplatform/ml-engine:latest' || '' }}
            ${{ github.ref == 'refs/heads/dev' && 'arthurplatform/ml-engine:latest-dev' || '' }}
          push: true
          platforms: linux/amd64
          sbom: true
      # Advisory vulnerability scan + justification docs (must never fail the release build).
      - name: Scan image & generate justification docs
        continue-on-error: true
        uses: ./.github/workflows/composite-actions/vuln-report
        with:
          image: arthurplatform/ml-engine:${{ env.VERSION }}
          slug: ml-engine
          dockerhub-username: ${{ secrets.DOCKERHUB_ENTERPRISE_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_ENTERPRISE_TOKEN }}
      # Do NOT `docker logout` here: `imagetools create` below reads the source image from
      # Docker Hub (logged in above) and writes to Artifactory (logged in now). Both sessions
      # coexist in the docker config.
      - name: Login to Artifactory
        run: |
          echo "${{ secrets.NEXUS_REPOSITORY_PASSWORD }}" | docker login docker.arthur.ai -u "${{ secrets.NEXUS_REPOSITORY_USERNAME }}" --password-stdin
      # imagetools copies the full image (incl. the SBOM attestation) registry-to-registry.
      # Required because buildx `push: true` does not load the image into the local docker
      # store, so the old `docker tag` on a local image would no longer find it.
      - name: Retag and push image to Artifactory
        run: |
          docker buildx imagetools create \
            --tag docker.arthur.ai/arthur/scope/ml-engine:${{ env.VERSION }} \
            arthurplatform/ml-engine:${{ env.VERSION }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              --tag docker.arthur.ai/arthur/scope/ml-engine:latest \
              arthurplatform/ml-engine:${{ env.VERSION }}
          fi
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            docker buildx imagetools create \
              --tag docker.arthur.ai/arthur/scope/ml-engine:latest-dev \
              arthurplatform/ml-engine:${{ env.VERSION }}
          fi

  check-models-updates:
    environment: shared-protected-branch-secrets
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check-updates.outputs.has_updates }}
      current_hash: ${{ steps.check-updates.outputs.current_hash }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so we can diff the model-upload build inputs against the
          # previous release commit (see the build-inputs change check below).
          fetch-depth: 0
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Check for model updates on HuggingFace
        id: check-updates
        run: |
          cd deployment/model-upload
          python check_model_updates.py --output github >> $GITHUB_OUTPUT
          # If either model image doesn't exist yet (bootstrap case), force a build
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'latest-dev' }}
          for IMAGE in "arthurplatform/genai-engine-models-s3" "arthurplatform/genai-engine-models-fs"; do
            NAMESPACE="${IMAGE%%/*}"
            REPO="${IMAGE##*/}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/${TAG}/")
            if [ "$STATUS" != "200" ]; then
              echo "::notice::${IMAGE}:${TAG} not found in Docker Hub (HTTP ${STATUS}) - forcing model image rebuild"
              echo "has_updates=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          # Force a rebuild when the files baked into the model-upload image change
          # (Dockerfile, Python dependencies, or the entrypoint scripts) even if the
          # HuggingFace models are unchanged. Without this, a dependency/Dockerfile
          # change (e.g. a security bump) is silently re-tagged onto the stale image
          # instead of rebuilt, so the fix never ships to the -s3/-fs images.
          #
          # Baseline = the version commit that produced the currently-published image,
          # found by walking THIS branch's own mainline (--first-parent) back to the
          # previous one. --first-parent is load-bearing:
          #   - dev: version bumps are committed directly to dev, so they sit on the
          #     first-parent line; --skip=1 -n 1 picks the previous dev bump.
          #   - main: each release lands as a dev->main *merge commit* titled
          #     "Increment arthur-engine version (#N)", so --first-parent follows main's
          #     release line and the baseline is the previous RELEASE. Without
          #     --first-parent the grep would instead return a dev bump swept in by the
          #     merge (whose tree equals HEAD's), making the diff empty and the check a
          #     no-op on the production branch.
          PREV_VERSION_COMMIT=$(git log --first-parent --grep='Increment arthur-engine version' --format='%H' --skip=1 -n 1)
          if [ -n "$PREV_VERSION_COMMIT" ]; then
            CHANGED=$(git diff --name-only "$PREV_VERSION_COMMIT" HEAD -- \
              Dockerfile pyproject.toml uv.lock download_models.py upload_models.py)
            if [ -n "$CHANGED" ]; then
              echo "::notice::model-upload build inputs changed since ${PREV_VERSION_COMMIT} - forcing model image rebuild:"
              echo "$CHANGED"
              echo "has_updates=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "::notice::no previous version-bump commit found - relying on model/bootstrap checks only"
          fi

  build-genai-engine-models-docker-image:
    uses: ./.github/workflows/build-ecs-model-upload.yml
    needs: [check-models-updates]
    if: |
      needs.check-models-updates.outputs.has_updates == 'true' &&
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    with:
      push: true
      image: arthurplatform/genai-engine-models-s3
    secrets: inherit

  tag-genai-engine-models-docker-image:
    needs: [check-models-updates]
    environment: shared-protected-branch-secrets
    if: |
      needs.check-models-updates.outputs.has_updates == 'false' &&
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
        with:
          version-prefix: "genai-engine-"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
      # imagetools copies the full image (incl. the SBOM attestation) registry-to-registry.
      # The previous `docker pull`/`tag`/`push` fetched only the platform manifest and would
      # drop the SBOM attestation from the newly-tagged version.
      - name: Retag previous models image with new version
        run: |
          SOURCE_TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'latest-dev' }}
          echo "No model updates detected - retagging ${SOURCE_TAG} as ${{ env.VERSION }}"
          docker buildx imagetools create \
            --tag arthurplatform/genai-engine-models-s3:${{ env.VERSION }} \
            arthurplatform/genai-engine-models-s3:${SOURCE_TAG}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              --tag arthurplatform/genai-engine-models-s3:latest \
              arthurplatform/genai-engine-models-s3:${SOURCE_TAG}
          fi

  build-genai-engine-models-fs-docker-image:
    uses: ./.github/workflows/build-fs-model-upload.yml
    needs: [check-models-updates]
    if: |
      needs.check-models-updates.outputs.has_updates == 'true' &&
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    with:
      push: true
      image: arthurplatform/genai-engine-models-fs
    secrets: inherit

  tag-genai-engine-models-fs-docker-image:
    needs: [check-models-updates]
    environment: shared-protected-branch-secrets
    if: |
      needs.check-models-updates.outputs.has_updates == 'false' &&
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
        with:
          version-prefix: "genai-engine-"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_OSS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_OSS_TOKEN }}
      # imagetools copies the full image (incl. the SBOM attestation) registry-to-registry.
      # The previous `docker pull`/`tag`/`push` fetched only the platform manifest and would
      # drop the SBOM attestation from the newly-tagged version.
      - name: Retag previous models fs image with new version
        run: |
          SOURCE_TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'latest-dev' }}
          echo "No model updates detected - retagging ${SOURCE_TAG} as ${{ env.VERSION }}"
          docker buildx imagetools create \
            --tag arthurplatform/genai-engine-models-fs:${{ env.VERSION }} \
            arthurplatform/genai-engine-models-fs:${SOURCE_TAG}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              --tag arthurplatform/genai-engine-models-fs:latest \
              arthurplatform/genai-engine-models-fs:${SOURCE_TAG}
          fi

  build-gcp-model-upload-docker-image:
    uses: ./.github/workflows/build-gcp-model-upload.yml
    needs: [check-models-updates]
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    with:
      push: true
      image: arthurplatform/genai-engine-models-gcs
    secrets: inherit

  push-all-cfts:
    needs: [build-genai-engine-docker-images, build-ml-engine-docker-images]
    environment: shared-protected-branch-secrets
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      BUCKET_NAME: arthur-cft
      TEMPLATES_DIRECTORY: arthur-engine
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
      - uses: ./.github/workflows/composite-actions/set-version
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@5ebd15afc69e5abcd499614d3ced5d65dc34087f
        with:
          role-to-assume: ${{ secrets.AWS_S3_ROLE_ARN }}
          role-session-name: ${{ secrets.AWS_S3_ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: push cf template
        run: |
          echo "Pushing Cloudformation template for ${{ env.VERSION }}"
          sed -i "s/REPLACE_ME_GENAI_ENGINE_VERSION/${{ env.VERSION }}/g" deployment/cloudformation/root-arthur-engine-cpu.yml
          sed -i "s/REPLACE_ME_GENAI_ENGINE_VERSION/${{ env.VERSION }}/g" deployment/cloudformation/root-arthur-engine-gpu.yml
          sed -i "s/REPLACE_ME_GENAI_ENGINE_VERSION/${{ env.VERSION }}/g" deployment/cloudformation/root-arthur-genai-engine-cpu.yml
          sed -i "s/REPLACE_ME_GENAI_ENGINE_VERSION/${{ env.VERSION }}/g" deployment/cloudformation/root-arthur-genai-engine-gpu.yml
          aws s3 sync ./deployment/cloudformation/ s3://${{ env.BUCKET_NAME }}/${{ env.TEMPLATES_DIRECTORY }}/templates/${{ env.VERSION }} --acl public-read
          aws s3 sync ./deployment/cloudformation/ s3://${{ env.BUCKET_NAME }}/${{ env.TEMPLATES_DIRECTORY }}/templates/latest --acl public-read

  push-aibom:
    needs: [build-genai-engine-docker-images, build-ml-engine-docker-images]
    environment: shared-protected-branch-secrets
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      BUCKET_NAME: arthur-cft
      ARTIFACT_DIRECTORY: arthur-engine
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
      - uses: ./.github/workflows/composite-actions/set-version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@5ebd15afc69e5abcd499614d3ced5d65dc34087f
        with:
          role-to-assume: ${{ secrets.AWS_S3_ROLE_ARN }}
          role-session-name: ${{ secrets.AWS_S3_ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: generate and push AI-BOM
        run: |
          echo "Generating AI-BOM for ${{ env.VERSION }}"
          cd deployment/model-upload
          # Catalog copy: HuggingFace LFS hashes + license/task (no weight download).
          python generate_aibom.py \
            --manifest models-manifest.json \
            --engine-version "${{ env.VERSION }}" \
            --output aibom.cdx.json
          aws s3 cp aibom.cdx.json s3://${{ env.BUCKET_NAME }}/${{ env.ARTIFACT_DIRECTORY }}/aibom/${{ env.VERSION }}/aibom.cdx.json --acl public-read
          aws s3 cp aibom.cdx.json s3://${{ env.BUCKET_NAME }}/${{ env.ARTIFACT_DIRECTORY }}/aibom/latest/aibom.cdx.json --acl public-read

  # Publish a CycloneDX SBOM per published image to the public arthur-cft bucket, giving stable
  # download URLs (versioned + `latest`). Modeled on push-all-cfts (same OIDC role + s3 sync).
  # SBOMs are generated fresh here with Trivy so coverage is uniform across all six images
  # regardless of whether a model image was freshly built or retagged (the retag path builds
  # nothing, so there is no artifact to reuse), and independent of the build jobs' internals.
  push-all-sboms:
    needs:
      - build-genai-engine-docker-images
      - build-ml-engine-docker-images
      - build-genai-engine-models-docker-image
      - tag-genai-engine-models-docker-image
      - build-genai-engine-models-fs-docker-image
      - tag-genai-engine-models-fs-docker-image
      - build-gcp-model-upload-docker-image
    environment: shared-protected-branch-secrets
    # `needs` on a skipped model build/tag job still enforces ordering (a skipped job counts as
    # complete), so whichever of each build/tag pair ran will have published the <VERSION> tag.
    # `!cancelled()` lets this run when the unused half of each pair is skipped; we only require
    # the two engine builds to have succeeded.
    if: |
      !cancelled() &&
      needs.build-genai-engine-docker-images.result == 'success' &&
      needs.build-ml-engine-docker-images.result == 'success' &&
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      BUCKET_NAME: arthur-cft
    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
      - uses: ./.github/workflows/composite-actions/set-version
      # Enterprise creds = higher pull-rate limit (same account vuln-report uses for pulls).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_ENTERPRISE_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ENTERPRISE_TOKEN }}
      # Unpinned latest: GitHub only retains recent release assets, so pinned tags eventually 404
      # (matches composite-actions/vuln-report).
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          token: ${{ github.token }}
      - name: Generate CycloneDX SBOMs
        run: |
          set -uo pipefail
          mkdir -p sbom-out
          # image repo (under arthurplatform/) -> output filename stem
          IMAGES="
          genai-engine-cpu
          genai-engine-gpu
          ml-engine
          genai-engine-models-s3
          genai-engine-models-fs
          genai-engine-models-gcs
          "
          for repo in $IMAGES; do
            ref="arthurplatform/${repo}:${VERSION}"
            echo "::group::SBOM for ${ref}"
            # Advisory: a single missing/failed image must not block publishing the rest.
            if trivy image --format cyclonedx --output "sbom-out/sbom-${repo}.cdx.json" "${ref}"; then
              echo "Generated sbom-${repo}.cdx.json"
            else
              echo "::warning::Failed to generate SBOM for ${ref}; skipping"
              rm -f "sbom-out/sbom-${repo}.cdx.json"
            fi
            # Clear trivy's image analysis cache between images to bound peak disk (model images
            # bundle large HF weights). Keeps the vuln/java DBs so they don't re-download.
            trivy clean --scan-cache >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          echo "SBOMs produced:"
          ls -la sbom-out
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@5ebd15afc69e5abcd499614d3ced5d65dc34087f
        with:
          role-to-assume: ${{ secrets.AWS_S3_ROLE_ARN }}
          role-session-name: ${{ secrets.AWS_S3_ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish SBOMs to S3
        run: |
          set -euo pipefail
          echo "Publishing SBOMs for ${VERSION}"
          aws s3 sync ./sbom-out s3://${BUCKET_NAME}/arthur-engine/sbom/${VERSION} --acl public-read
          # `latest` tracks the newest production release only: dev increments continuously, so
          # pointing the public `latest` SBOM at a dev build would be misleading.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            aws s3 sync ./sbom-out s3://${BUCKET_NAME}/arthur-engine/sbom/latest --acl public-read
          fi

  push-all-helm-charts:
    needs: [build-genai-engine-docker-images, build-ml-engine-docker-images]
    environment: shared-protected-branch-secrets
    if: |
      (github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-helm
      - uses: ./.github/workflows/composite-actions/set-version
        with:
          version-prefix: "genai-engine-"
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_OSS_TOKEN }}" | helm registry login registry-1.docker.io -u ${{ secrets.DOCKERHUB_OSS_USERNAME }} --password-stdin
      - name: Package and Push Helm chart
        env:
          CHART_PATH_GENAI_ENGINE: "deployment/helm/genai-engine"
          CHART_PATH_ML_ENGINE: "deployment/helm/ml-engine"
          CHART_NAMESPACE: ${{ github.ref == 'refs/heads/main' && 'charts' || 'charts-dev' }}
        run: |
          helm package ${CHART_PATH_GENAI_ENGINE} --version ${{ env.VERSION }} --app-version ${{ env.VERSION }}
          helm push arthur-genai-engine-${{ env.VERSION }}.tgz oci://ghcr.io/${{ github.repository }}/${{ env.CHART_NAMESPACE }}
          helm push arthur-genai-engine-${{ env.VERSION }}.tgz oci://registry-1.docker.io/arthurplatform
          helm package ${CHART_PATH_ML_ENGINE} --version ${{ env.VERSION }} --app-version ${{ env.VERSION }}
          helm push arthur-ml-engine-${{ env.VERSION }}.tgz oci://ghcr.io/${{ github.repository }}/${{ env.CHART_NAMESPACE }}
          helm push arthur-ml-engine-${{ env.VERSION }}.tgz oci://registry-1.docker.io/arthurplatform

  push-tag:
    needs: [push-all-cfts, push-all-helm-charts]
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/set-version
      - name: Push tag
        run: |
          git tag -a "${{ env.VERSION }}" -m "Create tag for Arthur Engine ${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

  deploy-genai-engine-cloudformation:
    needs: [push-tag]
    if: |
      github.repository == 'arthur-ai/arthur-engine' &&
      contains(github.event.head_commit.message, 'Increment arthur-engine version') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    container: node:20-alpine
    environment: shared-protected-branch-secrets
    steps:
      - name: Trigger GitLab Pipeline
        uses: fjogeleit/http-request-action@v1.16.5
        with:
          url: "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
          method: POST
          contentType: application/x-www-form-urlencoded
          data: "token=${{ secrets.DEPLOY_TRIGGER_TOKEN }}&ref=main&variables[TRIGGER_JOB]=deploy_arthur_engine&variables[ARTHUR_ENGINE_COMMIT_SHA]=${{ inputs.commit_sha || github.sha }}"
