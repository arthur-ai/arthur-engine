[project]
name = "ml-engine"
version = "2.1.1108"
description = ""
authors = [{ name = "Arthur", email = "engineering@arthur.ai" }]
license = "MIT"
readme = "README.md"
requires-python = "==3.13.*"

dependencies = [
  "croniter==6.2.4",
  "oracledb>=26,<27",
  "flask==3.1.3",
  "gcsfs==2026.10.1",
  "google-cloud-bigquery==3.47.0",
  "google-cloud-trace>=1.13.0,<2",
  "google-cloud-aiplatform>=2.1.3,<3",
  "pandas==3.0.6",
  "psycopg[binary]==3.3.6",
  "pymysql==1.2.3",
  "pyodbc==5.3.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "requests==2.34.2",
  "adlfs==2026.8.0",
  "s3fs==2026.9.0",
  # Ranged, not pinned: boto3 releases in lockstep with botocore, which aiobotocore (under
  # s3fs) caps, so the resolver picks the boto3 that matches it.
  "boto3>=1.43,<2",
  # Azure AI Foundry discovery. Held at 2.4.0: every later
  # azure-ai-projects requires openai>=3, and litellm (pinned by arthur-common) caps openai<3.
  "azure-ai-projects==2.4.0",
  "azure-identity==1.25.3",
  "regex==2026.9.29",
  "simple-settings==1.2.0",
  "httpx==0.28.1",
  "duckdb==1.5.6",
  "fsspec==2026.9.0",
  "datasketches==5.2.0",
  "numpy==2.3.2",
  "types-croniter==6.2.4.20261006",
  "types-psutil==7.2.2.20260906",
  "types-requests==2.33.0.20261030",
  "psutil==7.2.2",
  "pyarrow==25.0.1",
  "arthur-common==2.4.108",
  "gunicorn>=26,<27",
  # Held below 2.1: snowflake-sqlalchemy subclasses sqlalchemy.orm.context.ORMSelectCompileState,
  # which SQLAlchemy 2.1 made private, so it fails at import. See the sqlalchemy rule in /renovate.json.
  "sqlalchemy==2.0.55",
  "snowflake-sqlalchemy==1.11.1",
  "databricks-sqlalchemy>=2.0,<3",
  "databricks-sdk>=0.84.0,<1",
  "arthur-client==1.4.2971",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "responses==0.26.3",
  "pytest-httpserver==1.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-httpx==0.36.2",
  "pre-commit==4.7.0",
  "types-pytz>=2025.2.0.20250516",
  "lazy-imports==1.2.0",
  "graphql-core==3.3.1",
]
linters = [
  "mypy>=2.3,<3",
  "isort>=9,<10",
  "autoflake>=2.3.1,<3",
  "black==26.10.1",
]

[tool.uv]
exclude-newer = "3 days"
# SOC-222: certifi 2026.10.19 drops the compromised "emSign ECC Root CA - G3" root, which every
# earlier release trusts (2026.10.18 removed too many roots, so floor at .19). certifi bypasses
# the cooldown so the fix could land before 2026.10.19 was 3 days old.
exclude-newer-package = { arthur-client = false, arthur-common = false, certifi = false }
# grpcio's bundled roots.pem trusted the same root until 1.84.1 / 1.85.0; it is only a
# transitive dependency here. litellm < 1.106.3 has the same problem in its Rust extension;
# litellm arrives through arthur-common, which pins it exactly.
constraint-dependencies = ["certifi>=2026.10.19", "grpcio>=1.84.1", "litellm>=1.106.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_engine"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
implicit_reexport = true
explicit_package_bases = true
mypy_path = "src/ml_engine"
namespace_packages = true
exclude = ["src/genai_client", "src/ml_engine/discovery/_vendor"]

# The vendored upstream tree is verbatim and must stay that way. Excluded here rather
# than only in .pre-commit-config.yaml because CI invokes black and isort directly, so a
# pre-commit-only exclusion is honoured on a developer's machine and ignored in the one
# place that gates the merge. Found exactly that way: `would reformat
# discovery/_vendor/classify.py`, on a branch whose local hooks were clean.
[tool.black]
extend-exclude = "^/src/ml_engine/discovery/_vendor/"

[tool.isort]
profile = "black"
src_paths = ["src/ml_engine", "tests"]
extend_skip_glob = ["src/ml_engine/discovery/_vendor/*"]

[tool.pytest.ini_options]
# "." makes tests.fakes importable, as `python -m tests.fakes.<vendor>` runs them.
pythonpath = [".", "src", "src/genai_client"]
testpaths = ["tests"]
markers = [
    "integration_tests: mark a test as an integration test (requires real backend credentials via env vars)",
]
