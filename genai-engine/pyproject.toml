[project]
name = "arthur-genai-engine"
version = "2.1.801"
description = ""
authors = [{ name = "Arthur", email = "engineering@arthur.ai" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  # Held at 2.x: litellm 1.96.2 requires openai<3.0.0. Renovate's openai v3 bump (#2134)
  # edited this pin without relocking, so uv.lock kept 2.54.0 and `uv lock` could not
  # re-resolve at all. Raise this only once litellm supports openai v3.
  "openai==2.54.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "pydantic==2.13.4",
  "sse-starlette==3.4.8",
  "fastapi-sqlalchemy==0.2.1",
  "alembic==1.19.1",
  "boto3==1.43.72",
  "python-dotenv==1.2.2",
  "psycopg2-binary==2.9.12",
  "sqlalchemy==2.0.52",
  "pgvector==0.5.0",
  "python-multipart==0.0.32",
  "pypdf==6.16.1",
  "httpx==0.28.1",
  # Held below 5.14.0: gliner 0.2.28 (the latest release) requires
  # transformers>=4.51.3,<5.14.0. See the transformers rule in /renovate.json.
  "transformers==5.13.1",
  "authlib==1.7.2",
  "requests==2.34.2",
  "starlette==1.6.0",
  "pyjwt==2.13.0",
  "azure-storage-blob==12.30.0",
  "itsdangerous==2.2.0",
  "newrelic==13.4.0",
  # Held below 8.8.0: opentelemetry-api 1.39.1 (via opentelemetry-semantic-conventions
  # 0.60b1) requires importlib-metadata>=6.0,<8.8.0. See the importlib-metadata rule
  # in /renovate.json. Raise once the pinned OpenTelemetry stack widens its ceiling.
  "importlib-metadata==8.7.1",
  "opentelemetry-instrumentation-logging>=0.60b1,<0.61",
  "opentelemetry-instrumentation>=0.60b1,<0.61",
  "opentelemetry-instrumentation-fastapi>=0.60b1,<0.61",
  "opentelemetry-exporter-otlp>=1.39.1,<2",
  "opentelemetry-instrumentation-sqlalchemy>=0.60b1,<0.61",
  "tiktoken==0.13.0",
  "nltk==3.10.3",
  "more-itertools==11.1.0",
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "python-keycloak==7.1.1",
  "bcrypt==5.0.0",
  "cachetools==7.1.7",
  "sentence-transformers==5.7.0",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
  "torch==2.13.0 ; sys_platform == 'darwin'",
  "torch==2.13.0+cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
  "commonmark==0.9.2",
  "gunicorn>=26,<27",
  "fastapi-pagination==0.15.16",
  "pydantic-settings>=2.3.4,<3",
  "spacy>=3.8.3",
  "date-spacy>=0.0.1,<0.1",
  "bert-score==0.3.13",
  "langchain==1.3.15",
  "langchain-community==0.4.2",
  "langchain-openai==1.5.1",
  "langsmith==0.10.18",
  "msgpack==1.2.1",
  "cloudpickle==3.1.2",
  "amplitude-analytics>=1.1.5,<2",
  "sentencepiece==0.2.2",
  "gliner==0.2.28",
  "openinference-semantic-conventions>=0.1.12,<0.2",
  "litellm==1.96.2",
  "jinja2>=3.1.6,<4",
  "python-benedict>=0.38,<0.39",
  "weaviate-client>=4.17.0,<5",
  "arthur-common==2.4.70",
  "google-auth>=2.48.0,<3",
  "google-cloud-aiplatform>=1.38",
  "google-cloud-trace>=1.11.0,<2",
  "opentelemetry-semantic-conventions>=0.60b1,<0.61",
  "arthur-client==1.4.2419",
]

[project.scripts]
serve = "src.server:start"
generate_changelog = "changelog:main"
routes_security_check = "routes_security_check:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pre-commit==4.6.2",
  "types-cachetools>=6.2.0.20251022",
]
performance = [
  "locust==2.46.3",
]
linters = [
  "black==26.5.1",
  "mypy>=2.3,<3",
  "isort>=7.0.0",
  "autoflake>=2.3.1,<3",
]

[tool.uv]
exclude-newer = "3 days"
# fastapi-pagination bypasses the release-age soak: 0.15.16 (FastAPI 0.140 compat) was needed
# before it aged past the 3-day window. Without this, the lock's per-package override diverges
# from pyproject and uv re-resolves under the soak, failing to satisfy the ==0.15.16 pin.
exclude-newer-package = { torch = false, arthur-common = false, arthur-client = false, fastapi-pagination = false }
# Security: pin transitive hf-xet (its wheel vendors Rust crates) to >=1.5.2, which bundles
# rustls-webpki 0.103.13 (RUSTSEC-2026-0104, HIGH: DoS panic in CRL parsing) and quinn-proto
# 0.11.15 (RUSTSEC-2026-0185 / CVE-2026-25800, HIGH: remote memory exhaustion). Both are fixed
# as of hf-xet 1.5.2 (xet-core v1.5.2 bumped the vendored quinn-proto 0.11.14 -> 0.11.15).
constraint-dependencies = ["hf-xet>=1.5.2"]
# Security: force transitive cryptography past presidio-anonymizer 2.2.364 (latest), which
# requires cryptography>=48.0.1,<49.0.0 and so pinned us to 48.0.1 — a version with three open
# advisories: CVE-2026-69248 (X.509 verifier accepts wildcard DNS names, escaping
# permittedSubtrees) and CVE-2026-69249 (duplicate self-signed intermediates cause exponential
# path-building), both fixed in 49.0.0, plus CVE-2026-69247 (PKCS#7 EnvelopedData Bleichenbacher
# oracle), fixed in 50.0.0. A constraint cannot lift an upper bound, hence an override.
# Safe to force: presidio-anonymizer's entire use of cryptography is AES-CBC with PKCS7 padding
# in operators/aes_cipher.py (`primitives.padding` and `primitives.ciphers.{Cipher, algorithms,
# modes}`) — unchanged across 48 -> 50. Verified its AESCipher encrypt/decrypt round-trips on
# 50.0.0 and the unit suite is unaffected. Drop this once presidio-anonymizer widens its pin.
override-dependencies = ["cryptography>=50.0.0"]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple"
priority = "primary"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "arthur-repo"
url = "https://gitlab.com/api/v4/projects/45576036/packages/pypi"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
implicit_reexport = true
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv"
pythonpath = ["src"]
testpaths = [
    "tests"
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "api_key_tests: mark a test as testing api key actions",
    "aws_live: mark a test as running against a live environment. AWS_BUCKET_NAME must be supplied as an environment variable",
    "azure_live: mark a test as running against a live environment. AZURE_STORAGE_CONTAINER_NAME and AZURE_STORAGE_CONNECTION_STRING must be supplied as a environment variables",
    "integration_tests: mark a test as running an integration test. These will tend to replicate user flows and minimize the amount of junk data created",
    "unit_tests: mark a test as part of the unit tests suite. These should run locally with no outside configuration required. Should also be entirely self contained (no external dependencies)",
    "skip_auto_api_key_create: mark a test as opting out of api key creation and deletion pre and post steps"
]

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
